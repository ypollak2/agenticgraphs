[project]
name = "agenticgraphs"
version = "0.1.0"
description = "A library of evolvable, quality-proven agentic graphs — for frameworks, developers, and agents themselves."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["jsonschema>=4.21", "pyyaml>=6.0"]

[project.scripts]
agr = "agenticgraphs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticgraphs"]

[dependency-groups]
dev = ["pytest>=8.0"]
