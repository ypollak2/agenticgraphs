[project]
# PyPI distribution name. The import package, CLI, and repo stay `agenticgraphs`;
# PyPI rejects that name as too similar to the unrelated `agentic-graphs` project
# (its similarity check strips separators), so the wheel ships under this name.
name = "vitruvian-graphs"
version = "0.9.4"
description = "A library of evolvable, quality-proven agentic graphs — for frameworks, developers, and agents themselves."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "ypollak2", email = "95884133+ypollak2@users.noreply.github.com" }]
keywords = ["agents", "multi-agent", "workflow", "graph", "langgraph", "crewai", "autogen", "mcp", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["jsonschema>=4.21", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/ypollak2/agenticgraphs"
Repository = "https://github.com/ypollak2/agenticgraphs"
Documentation = "https://ypollak2.github.io/agenticgraphs/"
Issues = "https://github.com/ypollak2/agenticgraphs/issues"
Changelog = "https://github.com/ypollak2/agenticgraphs/blob/main/CHANGELOG.md"

[project.scripts]
# `agr` is the documented short form. PyPI already hosts an unrelated `agr`
# package (Agent Resources) that installs a binary of the same name, so the
# fully-qualified alias below is a collision-free fallback.
agr = "agenticgraphs.cli:main"
agenticgraphs = "agenticgraphs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticgraphs"]

# The registry lives at the repo root (browsable on GitHub, CARD.md links resolve)
# but must ship *inside* the package so an installed wheel is self-contained.
# registry._resolve_root() prefers this copy, falling back to the checkout layout.
[tool.hatch.build.targets.wheel.force-include]
"graphs" = "agenticgraphs/data/graphs"
"spec" = "agenticgraphs/data/spec"
"specialities" = "agenticgraphs/data/specialities"
"abilities" = "agenticgraphs/data/abilities"
"usecases" = "agenticgraphs/data/usecases"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
# The adapters emit source for these three. Until now nothing imported them, so
# `test_adapters` could only `ast.parse` the output — a syntax check that would
# pass forever while the upstream API drifted underneath it. Installed here so
# the smoke tests can actually build the graph they claim to compile.
adapters = ["langgraph>=0.2", "crewai>=0.60", "pyautogen>=0.3"]

[tool.pytest.ini_options]
addopts = "--cov=agenticgraphs --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["src/agenticgraphs"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py310"

[tool.ruff.lint]
# S (flake8-bandit) is the point of adopting ruff here, not a bonus. The source
# already carried ten `# noqa: S307/S310/S603/BLE001` suppressions for a linter
# that had never run — including S307 on the `eval` that turned out to be a real
# RCE. A suppression nobody checks is a decision nobody made.
select = ["E", "F", "W", "I", "UP", "B", "C4", "S", "SIM", "RUF", "D2", "D4"]
ignore = [
    "E501",    # line length is handled by the formatter, not by failing the gate
    "D203", "D213", "D401", "D404", "D406", "D407", "D413",
    "B008",
    "SIM108",  # a ternary is not always clearer than the if/else it replaces
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on things production code must not do; that is their job.
# Docstring *formatting* rules earn their keep on library code a stranger
# reads; on tests the docstring is a note to the next maintainer and the
# rule is noise.
"tests/*" = ["S101", "S102", "S307", "D1", "D2", "D4", "S603", "S607"]
# Every script in here shells out to git, uv, or pytest by design — that is what
# a generator/auditor script is. S603/S607 flag the mechanism, not a defect.
# S105 fires on the literal "pass_rate" as a "hardcoded password".
"scripts/*" = ["S101", "D1", "D2", "D4", "S603", "S607", "S105", "RUF001", "E741"]
# `autonomy` and `bindings` run subprocesses as their entire purpose, each behind
# a documented opt-in gate (AGR_AUTONOMOUS, --allow-tools). The risk is governed
# there, not by the call syntax.
"src/agenticgraphs/autonomy.py" = ["S603", "S607"]
"src/agenticgraphs/bindings.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.10"
files = ["src/agenticgraphs"]
ignore_missing_imports = true
# Deliberately not --strict on adoption. A type checker that fails on 400
# pre-existing findings gets switched off, and one that is switched off is worth
# less than one enforcing a narrow rule. These are the checks that would have
# caught real bugs in this codebase's history.
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
