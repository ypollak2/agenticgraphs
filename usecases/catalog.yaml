  name: data-quality-audit
  domain: data-analytics
  pattern: parallel-swarm
  summary: Workers profile each table for nulls, drift, and duplicates.
  verification: violations emitted as machine-readable rules with counts
- id: uc-021
  name: dashboard-builder
  domain: data-analytics
  pattern: pipeline
  summary: From metric spec to working dashboard with tested queries.
  verification: every panel query executes under latency budget
- id: uc-022
  name: schema-migration-planner
  domain: data-analytics
  pattern: planner-executor-verifier
  summary: Plan backward-compatible schema changes with shadow reads.
  verification: shadow-read diff empty before cutover
- id: uc-023
  name: anomaly-investigation
  domain: data-analytics
  pattern: router
  summary: Route metric anomalies to seasonal, data-bug, or real-change analysts.
  verification: classification agrees with holdout labels
- id: uc-024
  name: ab-test-analysis
  domain: data-analytics
  pattern: debate
  summary: Two analysts argue significance and pitfalls, judge writes readout.
  verification: stats recomputed from raw data reproduce claimed effect
