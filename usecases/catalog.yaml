  pattern: parallel-swarm
  summary: Parallel readers summarize papers, merger builds themed review.
  verification: every claim cites a specific paper and section
- id: uc-027
  name: systematic-meta-analysis
  domain: research-knowledge
  pattern: pipeline
  summary: PRISMA-style screen, extract, pool effect sizes.
