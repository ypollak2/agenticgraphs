apiVersion: agr/v1
kind: UseCaseCatalog
entries:
- id: uc-001
  name: code-review-pipeline
  domain: software-engineering
  pattern: pipeline
  summary: Staged PR review with risk triage and parallel security plus style passes.
  verification: verdict in approve or request_changes; findings carry file and line
- id: uc-002
  name: bug-triage-and-fix
  domain: software-engineering
  pattern: planner-executor-verifier
  summary: Reproduce a bug, plan a fix, apply it in isolation, verify.
  verification: repro test fails before patch and passes after
- id: uc-003
  name: test-suite-generation
  domain: software-engineering
  pattern: generator-critic
  summary: Generate tests, critic rejects trivial or tautological assertions.
  verification: coverage delta positive; mutation score above baseline
- id: uc-004
  name: legacy-refactor
  domain: software-engineering
  pattern: pipeline
  summary: Refactor a module behind characterization tests.
  verification: behavior snapshot tests unchanged before and after
- id: uc-005
  name: framework-migration
  domain: software-engineering
  pattern: planner-executor-verifier
  summary: Port a codebase between frameworks in verifiable slices.
  verification: build and full test suite green on target stack
- id: uc-006
  name: dependency-upgrade
  domain: software-engineering
  pattern: pipeline
  summary: Upgrade pinned deps, scan changelogs for breakage, run suite.
  verification: lockfile updated; tests pass; no new deprecation warnings
- id: uc-007
  name: api-design-review
  domain: software-engineering
  pattern: debate
  summary: Two reviewers argue REST versus RPC tradeoffs, judge synthesizes.
  verification: spec passes lint; breaking changes enumerated
- id: uc-008
  name: performance-optimization
  domain: software-engineering
  pattern: loop
  summary: Profile, patch hotspot, re-benchmark until budget met.
  verification: benchmark under target with no test regressions
- id: uc-009
  name: release-notes-generation
  domain: software-engineering
  pattern: map-reduce
  summary: Summarize merged PRs per area, reduce into release notes.
  verification: every note links a merged PR; no orphan claims
- id: uc-010
  name: docs-code-sync-audit
  domain: software-engineering
  pattern: parallel-swarm
  summary: Workers execute every doc example against the current API.
  verification: all documented examples run exit zero
- id: uc-011
  name: incident-triage-router
  domain: devops-sre
  pattern: router
  summary: Classify severity and route incidents to the owning team.
  verification: routing matches on-call ownership map
- id: uc-012
  name: runbook-executor
  domain: devops-sre
  pattern: planner-executor-verifier
  summary: Execute a runbook step-wise with post-condition checks.
  verification: each step post-condition command exits zero
- id: uc-013
  name: alert-noise-reduction
  domain: devops-sre
  pattern: map-reduce
  summary: Cluster alerts, dedupe storms, emit one incident per cause.
  verification: dedupe ratio measured; no missed paging alert
- id: uc-014
  name: cloud-cost-optimizer
  domain: devops-sre
  pattern: pipeline
  summary: Scan usage, propose rightsizing, verify against SLO headroom.
  verification: projected savings computed from real billing export
- id: uc-015
  name: deploy-canary-verifier
  domain: devops-sre
  pattern: loop
  summary: Progressively shift traffic while checking error budgets.
  verification: rollback fires when error rate exceeds threshold
- id: uc-016
  name: postmortem-writer
  domain: devops-sre
  pattern: pipeline
  summary: Assemble timeline from logs and chat, draft blameless postmortem.
  verification: every timeline event cites a log or message id
- id: uc-017
  name: capacity-forecaster
  domain: devops-sre
  pattern: generator-critic
  summary: Forecast load, critic stress-tests assumptions against history.
  verification: backtest error within stated confidence band
- id: uc-018
  name: sql-generation-verified
  domain: data-analytics
  pattern: generator-critic
  summary: Generate SQL, critic checks schema validity and row sanity.
  verification: query executes; result passes row-count sanity assertions
- id: uc-019
  name: etl-pipeline-builder
  domain: data-analytics
  pattern: planner-executor-verifier
  summary: Design and build an ETL job from source to warehouse.
  verification: end-to-end run loads expected row counts
