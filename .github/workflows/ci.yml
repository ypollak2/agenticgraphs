name: gate
on:
  push: {branches: [main]}
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run --all-extras agr validate
      - run: uv run --all-extras python scripts/audit_usecases.py
      - run: uv run --all-extras pytest -q
