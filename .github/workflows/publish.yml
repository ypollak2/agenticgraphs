name: publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC — PyPI trusted publishing, no API token stored
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: Gate before publishing
        run: |
          uv run --all-extras agr validate
          uv run --all-extras pytest -q
      - run: uv build
      - name: Verify the built wheel is self-contained
        run: |
          uv venv /tmp/verify
          uv pip install --python /tmp/verify/bin/python dist/*.whl
          n=$(/tmp/verify/bin/agr list | wc -l)
          echo "graphs in installed wheel: $n"
          test "$n" -eq 52
      - uses: pypa/gh-action-pypi-publish@release/v1
