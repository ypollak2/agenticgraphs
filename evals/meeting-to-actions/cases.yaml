cases:
  - id: happy-path
    node_outputs:
      intake: {summary: "intake complete"}
      produce: {output: {'actions': [{'owner': 'Alice', 'date': '2026-08-01', 'quote': 'will do X'}]}}
      review: {revision_requested: false, attempts: 1}
  - id: retry-then-resolved
    node_outputs:
      intake: {summary: "intake complete"}
      produce:
        - {output: {'actions': [{'owner': '', 'date': '', 'quote': ''}]}}
        - {output: {'actions': [{'owner': 'Alice', 'date': '2026-08-01', 'quote': 'will do X'}]}}
      review:
        - {revision_requested: true, attempts: 1}
        - {revision_requested: false, attempts: 2}
