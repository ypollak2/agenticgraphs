cases:
- id: single-item
  node_outputs:
    partition:
      shard_count: 1
      shards:
      - i: 1
      - i: 2
      - i: 3
    map: {}
    reduce:
      output:
        entries:
        - advisory_url: https://vendor.example/advisory/1
          cve_ids:
          - CVE-2026-1
- id: multi-item
  node_outputs:
    partition:
      shard_count: 2
      shards:
      - i: 1
      - i: 2
      - i: 3
    map: {}
    reduce:
      output:
        entries:
        - advisory_url: https://vendor.example/advisory/1
          cve_ids:
          - CVE-2026-1
        - advisory_url: https://vendor.example/advisory/2
          cve_ids:
          - CVE-2026-2
          - CVE-2026-3
