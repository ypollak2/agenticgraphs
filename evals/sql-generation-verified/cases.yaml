cases:
  - id: generated-and-approved
    node_outputs:
      intake: {summary: "intake complete"}
      generate: {draft: "v1"}
      critique: {rejected: false, attempts: 1, output: {'query_executes': True, 'row_count_sane': True}}
  - id: revised-after-rejection
    node_outputs:
      intake: {summary: "intake complete"}
      generate:
        - {draft: "v1"}
        - {draft: "v2"}
      critique:
        - {rejected: true, attempts: 1}
        - {rejected: false, attempts: 2, output: {'query_executes': True, 'row_count_sane': True}}
