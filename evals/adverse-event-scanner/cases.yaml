cases:
- id: single-item
  node_outputs:
    partition:
      shard_count: 1
      shards:
      - i: 1
      - i: 2
      - i: 3
    map: {}
    reduce:
      output:
        signals:
        - type: nausea
          report_ids:
          - R1
          - R2
          count: 2
- id: multi-item
  node_outputs:
    partition:
      shard_count: 2
      shards:
      - i: 1
      - i: 2
      - i: 3
    map: {}
    reduce:
      output:
        signals:
        - type: nausea
          report_ids:
          - R1
          - R2
          count: 2
        - type: headache
          report_ids:
          - R3
          count: 1
