cases:
- id: single-item
  node_outputs:
    partition:
      shard_count: 1
      shards:
      - i: 1
      - i: 2
      - i: 3
    map: {}
    reduce:
      output:
        findings:
        - title: competitor launched feature X
          source_url: https://example.com/blog
          source_date: '2026-07-01'
- id: multi-item
  node_outputs:
    partition:
      shard_count: 2
      shards:
      - i: 1
      - i: 2
      - i: 3
    map: {}
    reduce:
      output:
        findings:
        - title: competitor launched feature X
          source_url: https://example.com/blog
          source_date: '2026-07-01'
        - title: competitor raised prices
          source_url: https://example.com/news
          source_date: '2026-07-15'
