cases:
- id: single-item
  node_outputs:
    partition:
      shard_count: 1
      shards:
      - i: 1
      - i: 2
      - i: 3
    map: {}
    reduce:
      output:
        insights:
        - theme: onboarding confusion
          participant_ids:
          - P1
          - P2
- id: multi-item
  node_outputs:
    partition:
      shard_count: 2
      shards:
      - i: 1
      - i: 2
      - i: 3
    map: {}
    reduce:
      output:
        insights:
        - theme: onboarding confusion
          participant_ids:
          - P1
          - P2
          - P3
        - theme: pricing page
          participant_ids:
          - P4
          - P5
