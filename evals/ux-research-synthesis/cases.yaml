# This graph is a strictly linear pipeline (partition -> map -> reduce) with
# no router or loop-back edge, so both cases exercise the same route; they
# differ in data coverage (single item vs. multiple items) instead.
cases:
  - id: single-item
    node_outputs:
      partition: {shard_count: 1}
      map: {}
      reduce: {output: {'insights': [{'theme': 'onboarding confusion', 'participant_ids': ['P1', 'P2']}]}}
  - id: multi-item
    node_outputs:
      partition: {shard_count: 2}
      map: {}
      reduce: {output: {'insights': [{'theme': 'onboarding confusion', 'participant_ids': ['P1', 'P2', 'P3']}, {'theme': 'pricing page', 'participant_ids': ['P4', 'P5']}]}}
