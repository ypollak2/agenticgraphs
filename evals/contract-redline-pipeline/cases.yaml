cases:
  - id: happy-path
    node_outputs:
      intake: {summary: "intake complete"}
      produce: {output: {'redlines': [{'clause': 'limitation of liability', 'playbook_ref': 'PB-4'}]}}
      review: {revision_requested: false, attempts: 1}
  - id: retry-then-resolved
    node_outputs:
      intake: {summary: "intake complete"}
      produce:
        - {output: {'redlines': [{'clause': 'limitation of liability', 'playbook_ref': ''}]}}
        - {output: {'redlines': [{'clause': 'limitation of liability', 'playbook_ref': 'PB-4'}]}}
      review:
        - {revision_requested: true, attempts: 1}
        - {revision_requested: false, attempts: 2}
