        status: done
    verify:
      verify_failed: false
      attempts: 1
      output:
        examples:
        - id: ex1
          exit_code: 0
- id: retry-then-verified
  node_outputs:
    plan:
      steps:
      - decompose goal
      tasks:
      - i: 1
      - i: 2
      - i: 3
    work:
    - work_result: *id001
    - work_result: *id001
    verify:
    - verify_failed: true
      attempts: 1
