cases:
- id: first-attempt-verified
  node_outputs:
    plan:
      steps:
      - decompose goal
    execute:
      step_result: &id001
        step: 1
        status: done
    verify:
      verify_failed: false
      attempts: 1
      output:
        test_failed_before_patch: true
        test_passes_after_patch: true
- id: retry-then-verified
  node_outputs:
    plan:
      steps:
      - decompose goal
    execute:
    - step_result: *id001
    - step_result: *id001
    verify:
    - verify_failed: true
      attempts: 1
    - verify_failed: false
      attempts: 2
      output:
        test_failed_before_patch: true
        test_passes_after_patch: true
