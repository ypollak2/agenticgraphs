cases:
  - id: happy-path
    node_outputs:
      intake: {summary: "intake complete"}
      produce: {output: {'timeline': [{'event': 'alert fired', 'log_id': 'L-1'}, {'event': 'paged on-call', 'message_id': 'M-2'}]}}
      review: {revision_requested: false, attempts: 1}
  - id: retry-then-resolved
    node_outputs:
      intake: {summary: "intake complete"}
      produce:
        - {output: {'timeline': [{'event': 'alert fired'}]}}
        - {output: {'timeline': [{'event': 'alert fired', 'log_id': 'L-1'}, {'event': 'paged on-call', 'message_id': 'M-2'}]}}
      review:
        - {revision_requested: true, attempts: 1}
        - {revision_requested: false, attempts: 2}
