# This graph is a strictly linear pipeline (partition -> map -> reduce) with
# no router or loop-back edge, so both cases exercise the same route; they
# differ in data coverage (single item vs. multiple items) instead.
cases:
  - id: single-item
    node_outputs:
      partition: {shard_count: 1}
      map: {}
      reduce: {output: {'dedupe_ratio': 0.8, 'missed_paging_alerts': []}}
  - id: multi-item
    node_outputs:
      partition: {shard_count: 2}
      map: {}
      reduce: {output: {'dedupe_ratio': 0.4, 'missed_paging_alerts': []}}
