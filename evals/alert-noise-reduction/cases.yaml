cases:
- id: single-item
  node_outputs:
    partition:
      shard_count: 1
      shards:
      - i: 1
      - i: 2
      - i: 3
    map:
      shard_result: &id001
      - id: 1
        finding: ok
    reduce:
      output:
        dedupe_ratio: 0.8
        missed_paging_alerts: []
- id: multi-item
  node_outputs:
    partition:
      shard_count: 2
      shards:
      - i: 1
      - i: 2
      - i: 3
    map:
      shard_result: *id001
    reduce:
      output:
        dedupe_ratio: 0.4
        missed_paging_alerts: []
