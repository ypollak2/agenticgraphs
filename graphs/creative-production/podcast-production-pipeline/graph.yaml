apiVersion: agr/v1.8
name: podcast-production-pipeline
description: 'Turn a raw recording into a published episode: transcript, edit plan, show notes, rights
  check, publish.'
category: creative-production
nodes:
- id: transcribe
  speciality: mapper
  abilities:
  - map_shard
  inputs:
  - recording
  outputs:
  - transcript
- id: edit-plan
  speciality: producer
  abilities:
  - generate
  inputs:
  - transcript
  outputs:
  - cut_list
- id: show-notes
  speciality: producer
  abilities:
  - generate
  inputs:
  - cut_list
  outputs:
  - show_notes
  - timestamps: list[{start:int, end:int}]
  parallel_group: edit-plan-fanout
- id: rights-check
  speciality: counsel
  abilities:
  - critique
  inputs:
  - cut_list
  outputs:
  - clearances: list[{license_ref:any}]
  - rights_clear: any
  parallel_group: edit-plan-fanout
- id: publish
  speciality: executor
  abilities:
  - execute_step
  inputs:
  - show_notes
  - rights_clear
  outputs:
  - clearances: list[{license_ref:any}]
  - output
  - published
  - timestamps: list[{start:int, end:int}]
  join: all
  unbound_ok: 'narrated: execute_step has no binding in this runtime; the effect is the model''s account
    of it until the ability is bound (audit 2026-09-04, Q1)'
- id: escalate-rights
  speciality: escalator
  abilities:
  - escalate
  inputs: []
  outputs:
  - escalated: bool
  - escalation_reason
  criteria: 'The episode is held with the clips whose licensing could not be confirmed. This node had
    no failure path at all: unclear rights stopped the graph, which looks identical to rights being clear.'
  unbound_ok: 'narrated: escalate has no binding in this runtime; the effect is the model''s account of
    it until the ability is bound (audit 2026-09-04, Q1)'
edges:
- from: transcribe
  to: edit-plan
- from: edit-plan
  to: show-notes
- from: edit-plan
  to: rights-check
- from: show-notes
  to: publish
- from: rights-check
  to: publish
  when: rights_clear
- from: rights-check
  to: escalate-rights
  when: not rights_clear
termination:
  max_steps: 30
  contract: no episode publishes with an uncleared cue or drifting timestamps
verification:
- describe: "every clip names the licence it cleared under \u2014 'rights are clear' is unfalsifiable,\
    \ a licence reference is not"
  assert: all(c.license_ref for c in output.clearances)
- describe: every chapter marker starts before it ends, which is what makes a timestamp valid rather than
    merely present
  assert: all(t.start < t.end for t in output.timestamps)
state:
  inputs:
  - goal
  - recording
goal:
  required: true
  description: the episode transcript to work from and the show it belongs to
