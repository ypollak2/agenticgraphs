cases:
- id: single-item
  node_outputs:
    partition:
      shard_count: 1
      shards:
      - i: 1
      - i: 2
      - i: 3
    map:
      shard_result: &id001
      - id: 1
        finding: ok
    reduce:
      output:
        insights:
        - theme: onboarding confusion
          participant_ids:
          - P1
          - P2
  goal: 12 onboarding interviews, on why trial users stall at step 3
- id: multi-item
  node_outputs:
    partition:
      shard_count: 2
      shards:
      - i: 1
      - i: 2
      - i: 3
    map:
      shard_result: *id001
    reduce:
      output:
        insights:
        - theme: onboarding confusion
          participant_ids:
          - P1
          - P2
          - P3
        - theme: pricing page
          participant_ids:
          - P4
          - P5
  goal: 12 onboarding interviews, on why trial users stall at step 3
