apiVersion: agr/v1.4
name: ux-research-synthesis
description: Code interview transcripts, reduce to themed insights.
category: creative-production
nodes:
- id: partition
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - shards
- id: map
  speciality: mapper
  abilities:
  - map_shard
  fan_out:
    over: shards
    max: 20
    on_partial: continue
- id: reduce
  speciality: reducer
  abilities:
  - reduce_merge
  kind: verifier
  outputs:
  - insights
  - output
edges:
- from: partition
  to: map
- from: map
  to: reduce
termination:
  max_steps: 20
  contract: every insight cites at least two participants
verification:
- assert: all(i.participant_ids[1:] for i in output.insights)
