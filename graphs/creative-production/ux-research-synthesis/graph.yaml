apiVersion: agr/v1.7
name: ux-research-synthesis
description: Code interview transcripts, reduce to themed insights.
category: creative-production
nodes:
- id: partition
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - shards
- id: map
  speciality: mapper
  abilities:
  - map_shard
  fan_out:
    over: shards
    max: 20
    on_partial: continue
  outputs:
  - shard_result
- id: reduce
  speciality: reducer
  abilities:
  - reduce_merge
  kind: verifier
  outputs:
  - insights: list[{participant_ids:any}]
  - output
edges:
- from: partition
  to: map
- from: map
  to: reduce
termination:
  max_steps: 20
  contract: every insight cites at least two participants
verification:
- assert: all(i.participant_ids[1:] for i in output.insights)
goal:
  required: true
  description: the interview notes to synthesize and the research question behind them
state:
  inputs:
  - goal
