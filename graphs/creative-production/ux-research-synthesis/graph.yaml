apiVersion: agr/v1
name: ux-research-synthesis
description: Code interview transcripts, reduce to themed insights.
category: creative-production
nodes:
- id: partition
  speciality: analyst
  abilities:
  - analyze
- id: map
  speciality: mapper
  abilities:
  - map_shard
  parallel_group: shards
- id: reduce
  speciality: reducer
  abilities:
  - reduce_merge
  kind: verifier
edges:
- from: partition
  to: map
- from: map
  to: reduce
termination:
  max_steps: 20
  contract: every insight cites at least two participants
verification:
- assert: all(i.participant_ids[1:] for i in output.insights)
