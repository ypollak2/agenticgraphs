apiVersion: agr/v1.8
name: screenplay-coverage
description: 'Produce studio-standard coverage: synopsis, structural analysis, comparables, and a defended
  recommendation.'
category: creative-production
nodes:
- id: read
  speciality: analyst
  abilities:
  - analyze
  inputs:
  - screenplay
  outputs:
  - synopsis
  - beats
- id: structure
  speciality: critic
  abilities:
  - critique
  inputs:
  - beats
  outputs:
  - structure_notes
- id: comparables
  speciality: supervisor
  kind: subgraph
  ref: research-knowledge/competitive-intelligence
  inputs:
  - synopsis
  outputs:
  - comps
  - findings: list[{source_date:any, source_url:any}]
- id: recommend
  speciality: judge
  abilities:
  - adjudicate
  kind: verifier
  inputs:
  - structure_notes
  - comps
  outputs:
  - output
  - rationale
  - recommendation: any
  join: all
  criteria: The verdict is one of pass, consider or recommend, and is defended against at least two named
    comparable titles and how they performed. A recommendation with no market comparison is an opinion,
    not coverage.
edges:
- from: read
  to: structure
- from: read
  to: comparables
- from: structure
  to: recommend
- from: comparables
  to: recommend
termination:
  max_steps: 25
  contract: coverage lands one of three verdicts, defended against at least two named comparables
verification:
- describe: the recommendation is one of the studio-standard verdicts
  assert: output.recommendation in ['pass','consider','recommend']
- describe: the verdict is defended against named comparables
  assert: len(output.comps) >= 2
state:
  inputs:
  - goal
  - screenplay
goal:
  required: true
  description: the screenplay to cover and the market it is being read for
