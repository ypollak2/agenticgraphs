apiVersion: agr/v1.8
name: blog-production-pipeline
description: Brief to outline to draft to edit to publish-ready post.
category: content-marketing
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: outline
  speciality: planner
  abilities:
  - decompose_goal
  inputs:
  - summary
  outputs:
  - outline
  criteria: The outline states the claim each section makes and the evidence it will use, so the draft has an argument to
    write rather than a topic to fill.
- id: produce
  speciality: producer
  abilities:
  - generate
  outputs:
  - max_match_ratio: float
  - style_violations: list
- id: review
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - max_match_ratio: float
  - output
  - style_violations: list
  - revision_requested: bool
  criteria: The draft passes the house style guide on voice, heading depth and sentence length, and no passage matches published
    text beyond an incidental phrase.
edges:
- from: intake
  to: outline
- from: outline
  to: produce
  guidance: "Write from the outline in your own words. Source material is there to tell you what is true, not to supply your\
    \ sentences \u2014 if a phrase in your draft could be lifted verbatim from something you were given, rewrite it. Long\
    \ shared runs of wording are the thing to avoid, not shared facts."
  pitfalls: paraphrasing so lightly that whole clauses survive intact from a source
- from: produce
  to: review
  condition: a draft exists and is ready to be checked
  guidance: "Check the draft against the house rules you were given, and check how closely it tracks the source material.\
    \ Report the worst overlap you find, not the average \u2014 one copied passage is what a reader would notice."
  pitfalls: reporting a comfortable mean while a single passage is near-identical to a source
- from: review
  to: produce
  when: revision_requested and attempts < 2
termination:
  max_steps: 12
  contract: style guide lint passes; plagiarism scan clean
verification:
- describe: "the style guide reports zero violations \u2014 a count the reader can check against the draft, not a lint verdict"
  assert: len(output.style_violations) == 0
- describe: no passage matches published text beyond an incidental phrase
  assert: output.max_match_ratio < 0.15
goal:
  required: true
  description: the content brief to develop and the audience it targets
state:
  inputs:
  - goal
  - brief
  - style_guide
  - reference_corpus
