cases:
- id: happy-path
  node_outputs:
    intake:
      summary: intake complete
    produce:
      output:
        lint_passed: true
        plagiarism_clean: true
    review:
      revision_requested: false
      attempts: 1
  goal: the 'observability for small teams' brief, for platform engineers
- id: retry-then-resolved
  node_outputs:
    intake:
      summary: intake complete
    produce:
    - output:
        lint_passed: false
        plagiarism_clean: false
    - output:
        lint_passed: true
        plagiarism_clean: true
    review:
    - revision_requested: true
      attempts: 1
    - revision_requested: false
      attempts: 2
  goal: the 'observability for small teams' brief, for platform engineers
