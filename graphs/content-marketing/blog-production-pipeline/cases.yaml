cases:
- id: happy-path
  node_outputs:
    intake:
      summary: intake complete
    produce:
      output:
        lint_passed: true
        plagiarism_clean: true
      style_violations: &id001 []
      max_match_ratio: 0.02
    review:
      revision_requested: false
      attempts: 1
      style_violations: &id002 []
      max_match_ratio: 0.02
      output:
        style_violations: &id003 []
        max_match_ratio: 0.02
    outline: &id004
      outline:
      - section: why
        claim: c
        evidence: e
  goal: the 'observability for small teams' brief, for platform engineers
  inputs:
    brief: &id005
      title: Observability for small teams
      audience: platform engineers
      must_cover:
      - what to instrument first
      - cost control
      - on-call ergonomics
      word_target: 900
    style_guide: &id006
      banned_phrases:
      - leverage
      - synergy
      - game-changing
      - in today's fast-paced world
      voice: second person, active
      max_sentence_words: 32
      require_code_example: true
    reference_corpus: &id007
    - id: r1
      text: Start by instrumenting the request path end to end before adding custom metrics.
    - id: r2
      text: Sampling is the main lever teams have on observability spend.
    - id: r3
      text: Alert on symptoms your users feel, not on every resource threshold.
- id: retry-then-resolved
  node_outputs:
    intake:
      summary: intake complete
    produce:
    - output:
        lint_passed: false
        plagiarism_clean: false
      style_violations: *id001
      max_match_ratio: 0.02
    - output:
        lint_passed: true
        plagiarism_clean: true
      style_violations: *id001
      max_match_ratio: 0.02
    review:
    - revision_requested: true
      attempts: 1
      style_violations: *id002
      max_match_ratio: 0.02
      output:
        style_violations: *id003
        max_match_ratio: 0.02
    - revision_requested: false
      attempts: 2
      style_violations: *id002
      max_match_ratio: 0.02
      output:
        style_violations: *id003
        max_match_ratio: 0.02
    outline: *id004
  goal: the 'observability for small teams' brief, for platform engineers
  inputs:
    brief: *id005
    style_guide: *id006
    reference_corpus: *id007
