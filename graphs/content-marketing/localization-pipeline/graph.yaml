apiVersion: agr/v1
name: localization-pipeline
description: Translate per locale, reduce into a consistency report.
category: content-marketing
nodes:
- id: partition
  speciality: analyst
  abilities:
  - analyze
- id: map
  speciality: mapper
  abilities:
  - map_shard
  parallel_group: shards
- id: reduce
  speciality: reducer
  abilities:
  - reduce_merge
  kind: verifier
edges:
- from: partition
  to: map
- from: map
  to: reduce
termination:
  max_steps: 20
  contract: back-translation similarity above threshold; glossary respected
verification:
- assert: output.similarity >= output.threshold and not output.glossary_violations
