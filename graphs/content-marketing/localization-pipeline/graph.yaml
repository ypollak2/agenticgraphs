apiVersion: agr/v1.5
name: localization-pipeline
description: Translate per locale, reduce into a consistency report.
category: content-marketing
nodes:
- id: partition
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - shards
- id: map
  speciality: mapper
  abilities:
  - map_shard
  fan_out:
    over: shards
    max: 20
    on_partial: continue
  outputs:
  - shard_result
- id: reduce
  speciality: reducer
  abilities:
  - reduce_merge
  kind: verifier
  outputs:
  - glossary_violations
  - output
  - similarity
  - threshold
edges:
- from: partition
  to: map
- from: map
  to: reduce
termination:
  max_steps: 20
  contract: back-translation similarity above threshold; glossary respected
verification:
- assert: output.similarity >= output.threshold and not output.glossary_violations
