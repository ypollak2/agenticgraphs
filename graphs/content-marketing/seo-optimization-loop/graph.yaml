apiVersion: agr/v1.5
name: seo-optimization-loop
description: Rewrite for target queries, re-score, iterate to threshold.
category: content-marketing
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: attempt
  speciality: producer
  abilities:
  - generate
  outputs:
  - seo_score
  - stuffing_flags
  - threshold
- id: measure
  speciality: evaluator
  abilities:
  - evaluate
  kind: verifier
  outputs:
  - output
edges:
- from: intake
  to: attempt
- from: attempt
  to: measure
- from: measure
  to: attempt
  when: below_target and attempts < 5
termination:
  max_steps: 15
  contract: seo score above threshold without keyword stuffing flags
verification:
- assert: output.seo_score >= output.threshold and not output.stuffing_flags
