apiVersion: agr/v1.8
name: seo-optimization-loop
description: Rewrite for target queries, re-score, iterate to threshold.
category: content-marketing
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: attempt
  speciality: producer
  abilities:
  - generate
  outputs:
  - seo_score: float
  - stuffing_flags
  inputs:
  - threshold
- id: measure
  speciality: evaluator
  abilities:
  - evaluate
  kind: verifier
  outputs:
  - output
  - below_target: bool
  criteria: 'The page clears the score threshold for its target queries while still reading naturally:
    keyword density that trips a stuffing flag fails even at a passing score.'
edges:
- from: intake
  to: attempt
- from: attempt
  to: measure
- from: measure
  to: attempt
  when: below_target and attempts < 5
termination:
  max_steps: 15
  contract: seo score above threshold without keyword stuffing flags
verification:
- assert: output.seo_score >= output.threshold and not output.stuffing_flags
goal:
  required: true
  description: the page to optimize and the queries it should rank for
state:
  inputs:
  - goal
  - threshold
