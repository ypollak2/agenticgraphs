apiVersion: agr/v1.8
name: architecture-decision-tournament
description: Independent designs are scored on one rubric, and the winner must beat the runner-up on record.
category: software-engineering
nodes:
- id: frame
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - options
  - rubric
  inputs:
  - decision
- id: design
  speciality: advocate
  abilities:
  - generate
  outputs:
  - proposal
  - rubric_score
  inputs:
  - options
  fan_out:
    over: options
    max: 6
- id: judge
  speciality: judge
  abilities:
  - adjudicate
  outputs:
  - designs_scored: int
  - margin: any
  - output
  - winner
  inputs:
  - proposal
  - rubric_score
  aggregate:
    op: best
    over: rubric_score
  kind: verifier
  criteria: At least three independent designs were scored on one rubric, and the decision names the runner-up and the margin
    over it, so the choice can be revisited when the evidence changes rather than re-argued from scratch.
edges:
- from: frame
  to: design
  condition: the problem has been framed and its constraints are explicit
  guidance: "A tournament needs a field, not a favourite. Put forward several genuinely different candidate approaches \u2014\
    \ rival architectures that trade off against each other, not variations on one idea. Two options is a comparison; a real\
    \ field is broader than that."
  pitfalls: proposing one strong option plus token straw men, or stopping early because the remaining candidates look similar
    to one already on the table
- from: design
  to: judge
  condition: candidate approaches are on the table and ready to be compared
  guidance: "Evaluate every candidate on the same rubric before ranking any of them, and record the evaluation for each one\
    \ you were given \u2014 a ranking that quietly drops a candidate is not a tournament. Then say explicitly how far ahead\
    \ the winner finished and why the closest rival lost."
  pitfalls: ranking on impressions instead of the shared rubric, or declaring a winner without stating the gap to the runner-up
termination:
  max_steps: 6
  contract: a decision names its runner-up and the margin, so it can be revisited on evidence
verification:
- describe: at least three designs were scored on the same rubric
  assert: output.designs_scored >= 3
- describe: the decision records why the runner-up lost
  assert: output.margin is not None
state:
  inputs:
  - goal
  - decision
goal:
  required: true
  description: the architecture decision to settle and the constraints any winner must meet
