apiVersion: agr/v1.8
name: benchmark-driven-optimization-search
description: Branch candidate optimizations, score each on a real benchmark, keep the beam, prune the
  rest.
category: software-engineering
nodes:
- id: profile
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - hotspot
  - baseline_ms: float
  inputs:
  - repo
- id: explore
  speciality: producer
  abilities:
  - generate
  outputs:
  - patch
  - bench_ms: float
  inputs:
  - hotspot
  kind: search
  search:
    branch: 4
    depth: 3
    score: bench_ms
    objective: min
    prune: beam(2)
- id: verify
  speciality: qa-lead
  abilities:
  - run_suite
  outputs:
  - baseline_ms
  - bench_ms
  - output
  inputs:
  - patch
  kind: verifier
  criteria: The retained candidate is measurably faster than baseline on the real benchmark with the suite
    green. A candidate that is faster because it stopped doing the work is the failure this node catches.
  unbound_ok: 'narrated: run_suite has no binding in this runtime; the effect is the model''s account
    of it until the ability is bound (audit 2026-09-04, Q1)'
edges:
- from: profile
  to: explore
- from: explore
  to: verify
termination:
  max_steps: 40
  contract: the retained candidate is faster than baseline with a green suite; losers are pruned, not
    shipped
verification:
- describe: the retained candidate is faster than the baseline `profile` measured
  assert: output.bench_ms < output.baseline_ms
- describe: "the suite is green \u2014 the exit code is the fact, not a claim about it"
  command: pytest -q
state:
  inputs:
  - goal
  - repo
goal:
  required: true
  description: the repository to optimize and the benchmark that scores it
