apiVersion: agr/v1
name: docs-code-sync-audit
description: Workers execute every doc example against the current API.
category: software-engineering
nodes:
- id: plan
  speciality: planner
  abilities:
  - decompose_goal
- id: work
  speciality: worker
  abilities:
  - run_command
  - edit_files
  parallel_group: swarm
- id: verify
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
edges:
- from: plan
  to: work
- from: work
  to: verify
- from: verify
  to: work
  when: verify_failed and attempts < 3
termination:
  max_steps: 30
  contract: all documented examples run exit zero
verification:
- assert: all documented examples run exit zero
