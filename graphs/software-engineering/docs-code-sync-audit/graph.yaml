apiVersion: agr/v1.4
name: docs-code-sync-audit
description: Workers execute every doc example against the current API.
category: software-engineering
nodes:
- id: plan
  speciality: planner
  abilities:
  - decompose_goal
  outputs:
  - tasks
- id: work
  speciality: worker
  abilities:
  - run_command
  - edit_files
  fan_out:
    over: tasks
    max: 20
    on_partial: continue
- id: verify
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
  outputs:
  - examples
  - output
edges:
- from: plan
  to: work
- from: work
  to: verify
- from: verify
  to: work
  when: verify_failed and attempts < 3
termination:
  max_steps: 30
  contract: all documented examples run exit zero
verification:
- assert: all(e.exit_code == 0 for e in output.examples)
triggers:
- 'on': webhook
  source: github
  event: pull_request
budget:
  usd_max: 1.5
durability:
  checkpoint: every_node
  resume: true
