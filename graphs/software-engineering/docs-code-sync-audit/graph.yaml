apiVersion: agr/v1.8
name: docs-code-sync-audit
description: Extract every code example from the docs and execute it, recording the real exit code for
  each.
category: software-engineering
nodes:
- id: plan
  speciality: planner
  abilities:
  - decompose_goal
  outputs:
  - tasks: list[{doc:str, snippet:str}]
- id: work
  speciality: worker
  abilities:
  - run_command
  - edit_files
  fan_out:
    over: tasks
    max: 20
    on_partial: continue
  outputs:
  - work_result: '{doc:str, command:str, exit_code:int}'
- id: verify
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
  outputs:
  - examples: list[{doc:str, exit_code:int}]
  - output
  criteria: Every code example extracted from the docs was actually executed and exited zero. An example
    that was read and judged plausible has not been checked.
edges:
- from: plan
  to: work
- from: work
  to: verify
- from: verify
  to: work
  when: verify_failed and attempts < 3
termination:
  max_steps: 30
  contract: all documented examples run exit zero
verification:
- assert: all(e.exit_code == 0 for e in output.examples)
triggers:
- 'on': webhook
  source: github
  event: pull_request
budget:
  usd_max: 1.5
durability:
  checkpoint: every_node
  resume: true
goal:
  required: true
  description: the documentation to audit and the codebase it describes
  supplied_by_trigger: true
state:
  inputs:
  - goal
