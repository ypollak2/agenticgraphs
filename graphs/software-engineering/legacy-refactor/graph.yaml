apiVersion: agr/v1
name: legacy-refactor
description: Refactor a module behind characterization tests.
category: software-engineering
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
- id: produce
  speciality: producer
  abilities:
  - generate
- id: review
  speciality: critic
  abilities:
  - critique
  kind: verifier
edges:
- from: intake
  to: produce
- from: produce
  to: review
- from: review
  to: produce
  when: revision_requested and attempts < 2
termination:
  max_steps: 12
  contract: behavior snapshot tests unchanged before and after
verification:
- assert: output.snapshot_before == output.snapshot_after
