apiVersion: agr/v1.8
name: legacy-refactor
description: Refactor a module behind characterization tests.
category: software-engineering
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: produce
  speciality: producer
  abilities:
  - generate
  outputs:
  - snapshot_after: any
  - snapshot_before: any
- id: review
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - output
  criteria: The characterization snapshots are identical before and after. A refactor is a change in structure
    and in nothing else; any behavioural difference means it was a rewrite.
edges:
- from: intake
  to: produce
- from: produce
  to: review
- from: review
  to: produce
  when: revision_requested and attempts < 2
termination:
  max_steps: 12
  contract: behavior snapshot tests unchanged before and after
verification:
- assert: output.snapshot_before == output.snapshot_after
- describe: "the characterization suite is green after the refactor \u2014 a refactor that changes behaviour\
    \ was a rewrite"
  command: pytest -q
goal:
  required: true
  description: the code to refactor and the test suite that must stay green
state:
  inputs:
  - goal
