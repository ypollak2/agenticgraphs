cases:
  - id: happy-path
    node_outputs:
      intake: {summary: "intake complete"}
      produce: {output: {'snapshot_before': 'hash-abc123', 'snapshot_after': 'hash-abc123'}}
      review: {revision_requested: false, attempts: 1}
  - id: retry-then-resolved
    node_outputs:
      intake: {summary: "intake complete"}
      produce:
        - {output: {'snapshot_before': 'hash-abc123', 'snapshot_after': 'hash-def456'}}
        - {output: {'snapshot_before': 'hash-abc123', 'snapshot_after': 'hash-abc123'}}
      review:
        - {revision_requested: true, attempts: 1}
        - {revision_requested: false, attempts: 2}
