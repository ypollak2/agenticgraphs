cases:
- id: happy-path
  node_outputs:
    port-slice.intake:
      summary: intake complete
    port-slice.produce:
      output:
        snapshot_before: hash-abc123
        snapshot_after: hash-abc123
    port-slice.review:
      slice_ported: true
      revision_requested: false
      attempts: 1
    inventory:
      slices: []
      risk_map: []
    supervise:
      slice_queue: []
    integrate:
      suite_green: true
      ported_slices: 3
      output: {}
    sign-off:
      migration_complete: migration_complete-value
      output:
        suite_green: true
        slices_remaining: 0
    escalate-migration: {}
  goal: port the admin app from Flask to FastAPI in verifiable slices
  inputs:
    repo:
      name: admin-app
      from_framework: Flask
      to_framework: FastAPI
      slices:
      - id: sl1
        module: auth
        endpoints: 4
        tests: 12
        ported: false
      - id: sl2
        module: reports
        endpoints: 6
        tests: 9
        ported: false
      - id: sl3
        module: settings
        endpoints: 3
        tests: 7
        ported: false
      test_command: pytest -q
      snapshot_command: python -m admin_app.snapshot
