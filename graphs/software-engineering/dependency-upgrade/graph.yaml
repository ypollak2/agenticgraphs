apiVersion: agr/v1.7
name: dependency-upgrade
description: Upgrade pinned deps, scan changelogs for breakage, run suite.
category: software-engineering
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: produce
  speciality: producer
  abilities:
  - generate
  outputs:
  - lockfile_updated: any
  - new_deprecations
  - tests_pass: any
- id: review
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - output
edges:
- from: intake
  to: produce
- from: produce
  to: review
- from: review
  to: produce
  when: revision_requested and attempts < 2
termination:
  max_steps: 12
  contract: lockfile updated; tests pass; no new deprecation warnings
verification:
- assert: output.lockfile_updated and output.tests_pass and not output.new_deprecations
triggers:
- 'on': schedule
  cron: 23 4 * * 1
budget:
  usd_max: 3.0
durability:
  checkpoint: every_node
  resume: true
