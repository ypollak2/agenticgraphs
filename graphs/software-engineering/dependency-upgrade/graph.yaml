apiVersion: agr/v1.8
name: dependency-upgrade
description: Upgrade pinned deps, scan changelogs for breakage, run suite.
category: software-engineering
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: produce
  speciality: producer
  abilities:
  - generate
  outputs:
  - lockfile_sha_after
  - lockfile_sha_before
  - new_deprecations: list
- id: review
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - lockfile_sha_after
  - lockfile_sha_before
  - new_deprecations: list
  - output
  - revision_requested: bool
  criteria: The lockfile is updated, the suite passes, and no new deprecation warning was introduced.
    A green suite that emits deprecations has deferred the breakage to the next upgrade, not avoided it.
edges:
- from: intake
  to: produce
- from: produce
  to: review
- from: review
  to: produce
  when: revision_requested and attempts < 2
termination:
  max_steps: 12
  contract: lockfile updated; tests pass; no new deprecation warnings
verification:
- describe: "the lockfile actually changed \u2014 a digest before and after, not a claim that it was updated"
  assert: output.lockfile_sha_before != output.lockfile_sha_after
- describe: no new deprecation was introduced; a green suite that emits them has deferred the breakage,
    not avoided it
  assert: len(output.new_deprecations) == 0
- describe: the suite passes against the upgraded lockfile
  command: pytest -q
triggers:
- 'on': schedule
  cron: 23 4 * * 1
budget:
  usd_max: 3.0
durability:
  checkpoint: every_node
  resume: true
goal:
  required: true
  description: the dependencies to upgrade and the suite that must stay green
  supplied_by_trigger: true
state:
  inputs:
  - goal
