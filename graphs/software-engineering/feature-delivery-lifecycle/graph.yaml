apiVersion: agr/v1.8
name: feature-delivery-lifecycle
description: "End-to-end feature delivery: research a problem, plan it, implement it, test it, audit the\
  \ change, fix what the audit found, document it, and release behind a human gate with a rollback path.\
  \ The implement, test and audit phases are not re-authored here \u2014 they reference the existing single-purpose\
  \ graphs as subgraphs."
category: software-engineering
state:
  inputs:
  - goal
  - repo
nodes:
- id: research
  speciality: researcher
  abilities:
  - read_papers
  - web_search
  inputs:
  - goal
  outputs:
  - research_brief
  - prior_art
  retries:
    max: 2
- id: plan
  speciality: planner
  abilities:
  - decompose_goal
  inputs:
  - research_brief
  - repo
  outputs:
  - plan
  - acceptance_criteria
- id: implement
  speciality: supervisor
  kind: subgraph
  ref: software-engineering/bug-triage-and-fix
  inputs:
  - plan
  outputs:
  - patch
  - test_failed_before_patch: any
  - test_passes_after_patch: any
- id: test
  speciality: supervisor
  kind: subgraph
  ref: software-engineering/test-suite-generation
  inputs:
  - patch
  - acceptance_criteria
  outputs:
  - coverage_delta: int
  - mutation_baseline: float
  - mutation_score: float
  - test_report
- id: audit
  speciality: supervisor
  kind: subgraph
  ref: software-engineering/code-review-pipeline
  inputs:
  - patch
  - test_report
  outputs:
  - verdict: any
  - findings: list[{file:any, line:int}]
- id: fix
  speciality: executor
  abilities:
  - execute_step
  - edit_files
  inputs:
  - findings
  outputs:
  - patch
  - audit_rounds
  unbound_ok: 'narrated: edit_files, execute_step has no binding in this runtime; the effect is the model''s
    account of it until the ability is bound (audit 2026-09-04, Q1)'
- id: docs
  speciality: docs-writer
  abilities:
  - write_docs
  - read_diff
  inputs:
  - patch
  - verdict
  outputs:
  - doc_changes: list[{file:any, pr_url:any}]
  join: all
- id: release-approval
  speciality: approver
  kind: human
  abilities:
  - approve
  inputs:
  - doc_changes
  outputs:
  - signed_off: any
  approval:
    contract: signed_off == true and verdict == 'approve'
    on_timeout: escalate
- id: release
  speciality: release-manager
  abilities:
  - cut_release
  inputs:
  - signed_off
  outputs:
  - released: any
  - release_tag
  - release_failed: bool
  on_error: rollback
  unbound_ok: 'narrated: cut_release has no binding in this runtime; the effect is the model''s account
    of it until the ability is bound (audit 2026-09-04, Q1)'
- id: rollback
  speciality: compensator
  abilities:
  - rollback
  inputs:
  - release_tag
  outputs:
  - doc_changes: list[{file:any, pr_url:any}]
  - output
  - rolled_back
  unbound_ok: 'narrated: rollback has no binding in this runtime; the effect is the model''s account of
    it until the ability is bound (audit 2026-09-04, Q1)'
edges:
- from: research
  to: plan
- from: plan
  to: implement
- from: implement
  to: test
- from: test
  to: audit
- from: audit
  to: fix
  when: verdict == 'request_changes'
- from: audit
  to: docs
  when: verdict == 'approve'
- from: fix
  to: audit
  when: audit_rounds < 2
- from: docs
  to: release-approval
- from: release-approval
  to: release
- from: release
  to: rollback
  kind: compensate
  when: release_failed
termination:
  max_steps: 60
  contract: A release is cut only after the audit verdict is approve, docs are updated, and a human signs
    off; a failed release is compensated by a rollback.
verification:
- describe: every documentation change names the file it touched and the PR it landed in, so 'docs updated'
    can be checked against the diff
  assert: all(d.file and d.pr_url for d in output.doc_changes)
- describe: the release carries a human signature
  assert: output.signed_off == true
- describe: the feature's tests pass in the repository it was delivered to
  command: pytest -q
goal:
  required: true
  description: the feature to deliver and the repository to deliver it in
