apiVersion: agr/v1.7
name: release-notes-generation
description: Summarize merged PRs per area, reduce into release notes.
category: software-engineering
nodes:
- id: partition
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - shards
- id: map
  speciality: mapper
  abilities:
  - map_shard
  fan_out:
    over: shards
    max: 20
    on_partial: continue
  outputs:
  - shard_result
- id: reduce
  speciality: reducer
  abilities:
  - reduce_merge
  - run_command
  kind: verifier
  outputs:
  - notes: list[{pr_url:any}]
  - orphan_claims
  - output
edges:
- from: partition
  to: map
- from: map
  to: reduce
termination:
  max_steps: 20
  contract: every note links a merged PR; no orphan claims
verification:
- assert: all(n.pr_url for n in output.notes) and not output.orphan_claims
