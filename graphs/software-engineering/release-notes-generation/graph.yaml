apiVersion: agr/v1
name: release-notes-generation
description: Summarize merged PRs per area, reduce into release notes.
category: software-engineering
nodes:
- id: partition
  speciality: analyst
  abilities:
  - analyze
- id: map
  speciality: mapper
  abilities:
  - map_shard
  parallel_group: shards
- id: reduce
  speciality: reducer
  abilities:
  - reduce_merge
  kind: verifier
edges:
- from: partition
  to: map
- from: map
  to: reduce
termination:
  max_steps: 20
  contract: every note links a merged PR; no orphan claims
verification:
- assert: every note links a merged PR; no orphan claims
