apiVersion: agr/v1.8
name: bug-triage-and-fix
description: Reproduce a bug, plan a fix, apply it in isolation, verify.
category: software-engineering
nodes:
- id: plan
  speciality: planner
  abilities:
  - decompose_goal
  outputs:
  - steps
- id: execute
  speciality: executor
  abilities:
  - execute_step
  outputs:
  - step_result
- id: verify
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
  outputs:
  - output
  - test_failed_before_patch: any
  - test_passes_after_patch: any
  criteria: The regression test fails against the unpatched code and passes against the patched code.
    A test that passes before the fix is testing something else.
edges:
- from: plan
  to: execute
- from: execute
  to: verify
- from: verify
  to: execute
  when: verify_failed and attempts < 3
termination:
  max_steps: 25
  contract: repro test fails before patch and passes after
verification:
- assert: output.test_failed_before_patch and output.test_passes_after_patch
- describe: the regression test fails on the unpatched tree and passes on the patched one
  command: pytest -q {test_path}
goal:
  required: true
  description: the bug report to fix and the repository it reproduces in
state:
  inputs:
  - goal
  - test_path
