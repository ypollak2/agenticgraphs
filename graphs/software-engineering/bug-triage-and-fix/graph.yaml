apiVersion: agr/v1.8
name: bug-triage-and-fix
description: Reproduce a bug, plan a fix, apply it in isolation, verify.
category: software-engineering
nodes:
- id: plan
  speciality: planner
  abilities:
  - decompose_goal
  outputs:
  - steps
- id: execute
  speciality: executor
  abilities:
  - execute_step
  outputs:
  - step_result
- id: verify
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
  outputs:
  - exit_after: int
  - exit_before: int
  - output
  - verify_failed: bool
  criteria: The regression test fails against the unpatched code and passes against the patched code.
    A test that passes before the fix is testing something else.
  retries:
    max: 2
edges:
- from: plan
  to: execute
- from: execute
  to: verify
- from: verify
  to: execute
  when: verify_failed and attempts < 3
termination:
  max_steps: 25
  contract: repro test fails before patch and passes after
verification:
- describe: the regression test is run before and after the patch; the exit codes are the fact, not a
    verdict about them
  assert: output.exit_before != 0 and output.exit_after == 0
- describe: the suite is run
  command: pytest -q {test_path}
goal:
  required: true
  description: the bug report to fix and the repository it reproduces in
state:
  inputs:
  - goal
  - test_path
