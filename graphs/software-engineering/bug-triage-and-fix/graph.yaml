apiVersion: agr/v1.8
name: bug-triage-and-fix
description: Reproduce a bug, plan a fix, apply it in isolation, verify.
category: software-engineering
nodes:
- id: plan
  speciality: planner
  abilities:
  - decompose_goal
  outputs:
  - steps
- id: execute
  speciality: executor
  abilities:
  - execute_step
  outputs:
  - step_result
  unbound_ok: 'narrated: execute_step has no binding in this runtime; the effect is the model''s account of it until the ability
    is bound (audit 2026-09-04, Q1)'
- id: verify
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
  outputs:
  - exit_after: int
  - exit_before: int
  - output
  - verify_failed: bool
  criteria: The regression test fails against the unpatched code and passes against the patched code. A test that passes before
    the fix is testing something else.
  retries:
    max: 2
    reissue_effects: true
edges:
- from: plan
  to: execute
  condition: the reproduction is understood and a fix can be attempted
  guidance: "Reproduce the failure first and record what the check returned before you change anything, then make the fix\
    \ and run the same check again. Both readings are part of the evidence \u2014 a fix with no before-reading cannot be shown\
    \ to have fixed anything."
  pitfalls: changing the code first and only checking afterwards
- from: execute
  to: verify
- from: verify
  to: execute
  when: verify_failed and attempts < 3
termination:
  max_steps: 14
  contract: repro test fails before patch and passes after
verification:
- describe: the regression test is run before and after the patch; the exit codes are the fact, not a verdict about them
  assert: output.exit_before != 0 and output.exit_after == 0
- describe: the suite is run
  command: pytest -q {test_path}
goal:
  required: true
  description: the bug report to fix and the repository it reproduces in
state:
  inputs:
  - goal
  - test_path
  - issue
  - repro_command
