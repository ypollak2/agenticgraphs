apiVersion: agr/v1.7
name: test-suite-generation
description: Generate tests, critic rejects trivial or tautological assertions.
category: software-engineering
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: generate
  speciality: producer
  abilities:
  - generate
  outputs:
  - draft
- id: critique
  speciality: critic
  abilities:
  - critique
  - run_command
  kind: verifier
  outputs:
  - coverage_delta: int
  - mutation_baseline: float
  - mutation_score: float
  - output
edges:
- from: intake
  to: generate
- from: generate
  to: critique
- from: critique
  to: generate
  when: rejected and attempts < 3
termination:
  max_steps: 10
  contract: coverage delta positive; mutation score above baseline
verification:
- assert: output.coverage_delta > 0 and output.mutation_score > output.mutation_baseline
