apiVersion: agr/v1.8
name: test-suite-generation
description: Generate tests, critic rejects trivial or tautological assertions.
category: software-engineering
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: generate
  speciality: producer
  abilities:
  - generate
  outputs:
  - draft
- id: critique
  speciality: critic
  abilities:
  - critique
  - run_command
  kind: verifier
  outputs:
  - coverage_delta: int
  - mutation_baseline: float
  - mutation_score: float
  - output
  criteria: Coverage increases and the mutation score beats the baseline. A test that executes a line
    without asserting anything about it raises coverage and catches nothing, which is exactly what mutation
    score exists to detect.
edges:
- from: intake
  to: generate
- from: generate
  to: critique
- from: critique
  to: generate
  when: rejected and attempts < 3
termination:
  max_steps: 10
  contract: coverage delta positive; mutation score above baseline
verification:
- assert: output.coverage_delta > 0 and output.mutation_score > output.mutation_baseline
- describe: the generated tests run, and the mutation score is measured rather than claimed
  command: pytest -q
goal:
  required: true
  description: the module to test and the coverage or mutation bar it must clear
state:
  inputs:
  - goal
