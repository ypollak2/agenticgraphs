apiVersion: agr/v1.8
name: performance-optimization
description: Profile, patch hotspot, re-benchmark until budget met.
category: software-engineering
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: attempt
  speciality: producer
  abilities:
  - generate
  outputs:
  - benchmark_ms: float
  - test_regressions
  inputs:
  - target_ms
- id: measure
  speciality: evaluator
  abilities:
  - evaluate
  kind: verifier
  outputs:
  - output
  - below_target: bool
  criteria: The benchmark is under the target budget with no test regressions, and the measurement is
    of the same workload as the baseline. Comparing a tuned run against an untuned one on different input
    measures nothing.
edges:
- from: intake
  to: attempt
- from: attempt
  to: measure
- from: measure
  to: attempt
  when: below_target and attempts < 5
termination:
  max_steps: 15
  contract: benchmark under target with no test regressions
verification:
- assert: output.benchmark_ms <= output.target_ms and not output.test_regressions
- describe: the benchmark is executed, not estimated
  command: pytest -q --benchmark-only
goal:
  required: true
  description: the workload to optimize and the latency or throughput target
state:
  inputs:
  - goal
  - target_ms
