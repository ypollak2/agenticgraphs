apiVersion: agr/v1.8
name: supplier-risk-monitor
description: Score supplier concentration, financial and geographic risk, then plan mitigation for anything
  above appetite.
category: logistics-retail
nodes:
- id: ingest
  speciality: supervisor
  kind: subgraph
  ref: research-knowledge/competitive-intelligence
  inputs:
  - supplier_list
  outputs:
  - findings: list[{source_date:any, source_url:any}]
  - supplier_signals
- id: score
  speciality: analyst
  abilities:
  - analyze
  inputs:
  - supplier_signals
  outputs:
  - risk_scores
  fan_out:
    over: supplier_signals
- id: concentrate
  speciality: analyst
  abilities:
  - analyze
  inputs:
  - risk_scores
  outputs:
  - concentration
- id: mitigate
  speciality: planner
  abilities:
  - decompose_goal
  kind: verifier
  inputs:
  - concentration
  outputs:
  - above_appetite
  - concentration
  - mitigations
  - mitigations_planned
  - output
  criteria: Every supplier above the risk appetite has a mitigation with a named owner, and single-source
    dependencies are flagged even when the supplier is currently performing well. Concentration risk is
    about what happens when they stop.
edges:
- from: ingest
  to: score
- from: score
  to: concentrate
- from: concentrate
  to: mitigate
termination:
  max_steps: 25
  contract: every supplier above risk appetite carries a named mitigation owner
verification:
- describe: every supplier above appetite has a planned mitigation
  assert: output.above_appetite == output.mitigations_planned
- describe: the single-source flag agrees with the supplier count `concentrate` measured, rather than
    being asserted
  assert: all(c.single_source == (c.supplier_count == 1) for c in output.concentration)
state:
  inputs:
  - goal
  - supplier_list
triggers:
- 'on': schedule
  cron: 41 6 * * *
budget:
  usd_max: 2.0
durability:
  checkpoint: every_node
  resume: true
goal:
  required: true
  description: the supplier portfolio to monitor and the risk thresholds that matter
  supplied_by_trigger: true
