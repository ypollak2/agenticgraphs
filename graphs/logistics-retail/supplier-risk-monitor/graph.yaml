apiVersion: agr/v1.9
name: supplier-risk-monitor
description: Score supplier concentration, financial and geographic risk, then plan mitigation for anything above appetite.
category: logistics-retail
nodes:
- id: ingest
  speciality: supervisor
  kind: subgraph
  ref: research-knowledge/competitive-intelligence
  inputs:
  - supplier_list
  outputs:
  - findings: list[{source_date:any, source_url:any}]
  - supplier_signals
  maps:
    supplier_signals: findings
- id: score
  speciality: analyst
  abilities:
  - analyze
  inputs:
  - supplier_signals
  outputs:
  - risk_scores
  fan_out:
    over: supplier_signals
- id: concentrate
  speciality: analyst
  abilities:
  - analyze
  inputs:
  - risk_scores
  outputs:
  - concentration: list[{single_source:bool, supplier_count:int}]
- id: mitigate
  speciality: planner
  abilities:
  - decompose_goal
  kind: verifier
  inputs:
  - concentration
  - supplier_list
  outputs:
  - above_appetite
  - concentration: list[{single_source:bool, supplier_count:int}]
  - mitigations
  - mitigations_planned
  - output
  criteria: Every supplier above the risk appetite has a mitigation with a named owner, and single-source dependencies are
    flagged even when the supplier is currently performing well. Concentration risk is about what happens when they stop.
edges:
- from: ingest
  to: score
- from: score
  to: concentrate
  condition: each supplier has been scored and the portfolio can be grouped
  guidance: "Group by what you buy, then for each group report both how many suppliers can actually deliver it and whether\
    \ you are dependent on exactly one. Those two statements are the same fact told two ways \u2014 make sure they agree with\
    \ each other in every group you report."
  pitfalls: marking a group as sole-sourced while also listing several suppliers for it
- from: concentrate
  to: mitigate
  condition: the grouping is complete and exposures are visible
  guidance: "Plan a mitigation for each group that sits beyond the tolerance you were given, and for those only \u2014 the\
    \ count you plan for and the count you flagged should match."
  pitfalls: flagging more exposures than you plan for, or planning for groups you never flagged
termination:
  max_steps: 12
  contract: every supplier above risk appetite carries a named mitigation owner
verification:
- describe: every supplier above appetite has a planned mitigation
  assert: output.above_appetite == output.mitigations_planned
- describe: the single-source flag agrees with the supplier count `concentrate` measured, rather than being asserted
  assert: all(c.single_source == (c.supplier_count == 1) for c in output.concentration)
state:
  inputs:
  - goal
  - supplier_list
  - risk_appetite
triggers:
- 'on': schedule
  cron: 41 6 * * *
budget:
  usd_max: 2.0
durability:
  checkpoint: every_node
  resume: true
goal:
  required: true
  description: the supplier portfolio to monitor and the risk thresholds that matter
  supplied_by_trigger: true
