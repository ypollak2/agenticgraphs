apiVersion: agr/v1.8
name: product-listing-pipeline
description: Generate marketplace listings from spec sheets, checking claims against source and policy
  before publish.
category: logistics-retail
nodes:
- id: extract
  speciality: mapper
  abilities:
  - map_shard
  inputs:
  - spec_sheets
  outputs:
  - attributes
- id: write
  speciality: producer
  abilities:
  - generate
  inputs:
  - attributes
  outputs:
  - listing_copy
- id: claim-check
  speciality: supervisor
  kind: subgraph
  ref: research-knowledge/fact-check-pipeline
  inputs:
  - listing_copy
  - attributes
  outputs:
  - unsupported_claims
  - verdicts: list[{quote_span:any, source_url:any}]
  join: all
  parallel_group: write-fanout
- id: policy-check
  speciality: critic
  abilities:
  - critique
  inputs:
  - listing_copy
  outputs:
  - policy_violations
  parallel_group: write-fanout
- id: publish
  speciality: executor
  abilities:
  - execute_step
  inputs:
  - unsupported_claims
  - policy_violations
  outputs:
  - listings_published
  - output
  join: all
  unbound_ok: 'narrated: execute_step has no binding in this runtime; the effect is the model''s account
    of it until the ability is bound (audit 2026-09-04, Q1)'
- id: escalate-listing
  speciality: escalator
  abilities:
  - escalate
  inputs: []
  outputs:
  - escalated: bool
  - escalation_reason
  criteria: The listing is held with the claims that could not be substantiated. An unsupported product
    claim is a regulatory exposure, not a copy defect.
  unbound_ok: 'narrated: escalate has no binding in this runtime; the effect is the model''s account of
    it until the ability is bound (audit 2026-09-04, Q1)'
edges:
- from: extract
  to: write
- from: write
  to: claim-check
- from: write
  to: policy-check
- from: claim-check
  to: write
  when: len(unsupported_claims) > 0 and attempts < 2
- from: claim-check
  to: publish
  when: len(unsupported_claims) == 0
- from: policy-check
  to: publish
  when: len(policy_violations) == 0
- from: claim-check
  to: escalate-listing
  when: len(unsupported_claims) > 0 and attempts >= 2
- from: policy-check
  to: escalate-listing
  when: len(policy_violations) > 0
termination:
  max_steps: 30
  contract: every published claim traces to the spec sheet and clears marketplace policy
verification:
- describe: no listing claim lacks a spec-sheet source
  assert: len(output.unsupported_claims) == 0
- describe: no marketplace policy violation ships
  assert: len(output.policy_violations) == 0
state:
  inputs:
  - goal
  - spec_sheets
goal:
  required: true
  description: the products to list and the marketplace policy that governs them
