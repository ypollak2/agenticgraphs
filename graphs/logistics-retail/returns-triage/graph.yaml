apiVersion: agr/v1.8
name: returns-triage
description: Route returns by reason to refund, repair, or fraud review.
category: logistics-retail
nodes:
- id: route
  speciality: dispatcher
  abilities:
  - dispatch
  kind: router
  outputs:
  - complexity
- id: branch-simple
  speciality: producer
  abilities:
  - generate
  outputs:
  - assigned_disposition
- id: branch-complex
  speciality: producer
  abilities:
  - generate
  outputs:
  - assigned_disposition
- id: verify
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - expected_disposition
  - assigned_disposition
  - output
  criteria: The route agrees with the policy decision table for the stated reason code, and anything routed
    to fraud review cites the specific pattern that triggered it rather than a general suspicion.
  inputs:
  - policy_table
edges:
- from: route
  to: branch-simple
  when: complexity <= moderate
- from: route
  to: branch-complex
  when: complexity > moderate
- from: branch-simple
  to: verify
- from: branch-complex
  to: verify
termination:
  max_steps: 12
  contract: routing agrees with policy decision table
verification:
- describe: the decision agrees with the policy table the caller supplied
  assert: output.assigned_disposition == output.expected_disposition
- describe: the reference was actually consulted, not left empty
  assert: len(output.expected_disposition) > 0
goal:
  required: true
  description: the return request to route and the policy table that governs it
state:
  inputs:
  - goal
  - policy_table
