apiVersion: agr/v1
name: returns-triage
description: Route returns by reason to refund, repair, or fraud review.
category: logistics-retail
nodes:
- id: route
  speciality: dispatcher
  abilities:
  - dispatch
  kind: router
- id: branch-simple
  speciality: producer
  abilities:
  - generate
- id: branch-complex
  speciality: producer
  abilities:
  - generate
- id: verify
  speciality: critic
  abilities:
  - critique
  kind: verifier
edges:
- from: route
  to: branch-simple
  when: complexity <= moderate
- from: route
  to: branch-complex
  when: complexity > moderate
- from: branch-simple
  to: verify
- from: branch-complex
  to: verify
termination:
  max_steps: 12
  contract: routing agrees with policy decision table
verification:
- assert: routing agrees with policy decision table
