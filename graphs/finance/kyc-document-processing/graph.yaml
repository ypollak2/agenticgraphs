apiVersion: agr/v1.8
name: kyc-document-processing
description: Extract, cross-check, and flag gaps in KYC documents.
category: finance
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: produce
  speciality: producer
  abilities:
  - generate
  outputs:
  - fields: list[{validated:bool}]
- id: review
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - output
  criteria: Every extracted field validates against the document image it came from, and a field that
    could not be read is flagged as a gap rather than inferred from the rest of the pack.
edges:
- from: intake
  to: produce
- from: produce
  to: review
- from: review
  to: produce
  when: revision_requested and attempts < 2
termination:
  max_steps: 12
  contract: extracted fields validate against document images
verification:
- assert: all(f.validated for f in output.fields)
goal:
  required: true
  description: the customer documents to process and the jurisdiction's KYC requirements
state:
  inputs:
  - goal
