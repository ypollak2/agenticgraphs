apiVersion: agr/v1
name: kyc-document-processing
description: Extract, cross-check, and flag gaps in KYC documents.
category: finance
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
- id: produce
  speciality: producer
  abilities:
  - generate
- id: review
  speciality: critic
  abilities:
  - critique
  kind: verifier
edges:
- from: intake
  to: produce
- from: produce
  to: review
- from: review
  to: produce
  when: revision_requested and attempts < 2
termination:
  max_steps: 12
  contract: extracted fields validate against document images
verification:
- assert: extracted fields validate against document images
