cases:
  - id: happy-path
    node_outputs:
      intake: {summary: "intake complete"}
      produce: {output: {'fields': [{'name': 'date_of_birth', 'value': '1990-01-01', 'validated': True}]}}
      review: {revision_requested: false, attempts: 1}
  - id: retry-then-resolved
    node_outputs:
      intake: {summary: "intake complete"}
      produce:
        - {output: {'fields': [{'name': 'date_of_birth', 'value': '1990-01-01', 'validated': False}]}}
        - {output: {'fields': [{'name': 'date_of_birth', 'value': '1990-01-01', 'validated': True}]}}
      review:
        - {revision_requested: true, attempts: 1}
        - {revision_requested: false, attempts: 2}
