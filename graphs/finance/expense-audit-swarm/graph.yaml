apiVersion: agr/v1.8
name: expense-audit-swarm
description: Workers audit expense lines against policy in parallel.
category: finance
nodes:
- id: plan
  speciality: planner
  abilities:
  - decompose_goal
  outputs:
  - tasks
- id: work
  speciality: worker
  abilities:
  - run_command
  - edit_files
  fan_out:
    over: tasks
    max: 20
    on_partial: continue
  outputs:
  - work_result
  retries:
    max: 2
    reissue_effects: true
  unbound_ok: 'narrated: edit_files has no binding in this runtime; the effect is the model''s account
    of it until the ability is bound (audit 2026-09-04, Q1)'
- id: verify
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
  outputs:
  - output
  - violations: list[{line_id:any, policy_rule:any}]
  - verify_failed: bool
  criteria: Every violation names the expense line id and the specific policy rule it breaches, so the
    claimant can see what to fix rather than that something was wrong.
  retries:
    max: 2
    reissue_effects: true
edges:
- from: plan
  to: work
- from: work
  to: verify
- from: verify
  to: work
  when: verify_failed and attempts < 3
termination:
  max_steps: 30
  contract: violations carry line id and policy rule
verification:
- assert: all(v.line_id and v.policy_rule for v in output.violations)
goal:
  required: true
  description: the expense reports to audit and the policy that governs them
state:
  inputs:
  - goal
