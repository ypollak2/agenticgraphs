apiVersion: agr/v1
name: expense-audit-swarm
description: Workers audit expense lines against policy in parallel.
category: finance
nodes:
- id: plan
  speciality: planner
  abilities:
  - decompose_goal
- id: work
  speciality: worker
  abilities:
  - run_command
  - edit_files
  parallel_group: swarm
- id: verify
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
edges:
- from: plan
  to: work
- from: work
  to: verify
- from: verify
  to: work
  when: verify_failed and attempts < 3
termination:
  max_steps: 30
  contract: violations carry line id and policy rule
verification:
- assert: all(v.line_id and v.policy_rule for v in output.violations)
