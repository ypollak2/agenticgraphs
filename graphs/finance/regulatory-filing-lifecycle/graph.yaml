apiVersion: agr/v1.8
name: regulatory-filing-lifecycle
description: Collect figures, reconcile them to source, gate on controller sign-off, then file and retain
  evidence.
category: finance
nodes:
- id: collect
  speciality: mapper
  abilities:
  - map_shard
  inputs:
  - period
  outputs:
  - figures
- id: reconcile
  speciality: controller
  abilities:
  - analyze
  inputs:
  - figures
  outputs:
  - variance
  - filing_total
  - ledger_total
- id: controller-signoff
  speciality: approver
  kind: human
  abilities:
  - approve
  inputs:
  - filing_total
  - ledger_total
  outputs:
  - signed_off: any
  approval:
    contract: signed_off == true and reconciled == true
    on_timeout: escalate
- id: file
  speciality: controller
  abilities:
  - analyze
  - file_record
  inputs:
  - signed_off
  outputs:
  - filed: any
  - confirmation_id
- id: retain
  speciality: producer
  abilities:
  - generate
  inputs:
  - confirmation_id
  outputs:
  - evidence_pack
  - filing_total
  - ledger_total
  - output
- id: withdraw-filing
  speciality: compensator
  abilities:
  - rollback
  inputs: []
  outputs:
  - withdraw_filing_filed
  criteria: A filing is received the moment it is submitted. Undoing it is a formal withdrawal or amendment
    on the record, not a deletion, and the amendment must cite the filing it corrects.
edges:
- from: collect
  to: reconcile
- from: reconcile
  to: collect
  when: not reconciled and attempts < 3
- from: reconcile
  to: controller-signoff
  when: reconciled
- from: controller-signoff
  to: file
- from: file
  to: retain
- from: file
  to: withdraw-filing
  kind: compensate
  when: file_failed
termination:
  max_steps: 35
  contract: nothing files until figures reconcile to source and a controller signs
verification:
- describe: "the filed figures equal the ledger `collect` read \u2014 reconciliation is two numbers agreeing,\
    \ not a model reporting that they do"
  assert: output.filing_total == output.ledger_total
- describe: the filing carries a human signature
  assert: output.signed_off == true
- describe: the retained evidence pack exists
  assert: output.evidence_pack is not None
state:
  inputs:
  - goal
  - period
goal:
  required: true
  description: the filing period and the regime being filed under
