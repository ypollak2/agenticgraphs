apiVersion: agr/v1.8
name: earnings-call-digest
description: Transcript to guidance changes, surprises, and QA highlights.
category: finance
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: produce
  speciality: producer
  abilities:
  - generate
  outputs:
  - figures: list[{matches_transcript:bool}]
  - invented_numbers
- id: review
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - figures
  - invented_numbers
  - output
  - revision_requested: bool
  criteria: Every figure in the digest appears in the transcript. A number that is directionally right
    but never stated is an invented number.
edges:
- from: intake
  to: produce
- from: produce
  to: review
- from: review
  to: produce
  when: revision_requested and attempts < 2
termination:
  max_steps: 12
  contract: every figure matches transcript; no invented numbers
verification:
- assert: all(f.matches_transcript for f in output.figures) and not output.invented_numbers
goal:
  required: true
  description: the earnings call to digest and the prior guidance to compare against
state:
  inputs:
  - goal
