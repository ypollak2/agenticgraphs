apiVersion: agr/v1.2
name: literature-review-swarm
description: Parallel readers summarize papers, merger builds themed review.
category: research-knowledge
nodes:
- id: plan
  speciality: planner
  abilities:
  - decompose_goal
  outputs:
  - tasks
- id: work
  speciality: worker
  abilities:
  - run_command
  - edit_files
  fan_out:
    over: tasks
    max: 20
    on_partial: continue
- id: verify
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
  outputs:
  - output
edges:
- from: plan
  to: work
- from: work
  to: verify
- from: verify
  to: work
  when: verify_failed and attempts < 3
termination:
  max_steps: 30
  contract: every claim cites a specific paper and section
verification:
- assert: all(c.paper and c.section for c in output.claims)
