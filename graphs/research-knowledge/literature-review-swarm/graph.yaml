apiVersion: agr/v1.8
name: literature-review-swarm
description: Parallel readers summarize papers, merger builds themed review.
category: research-knowledge
nodes:
- id: plan
  speciality: planner
  abilities:
  - decompose_goal
  outputs:
  - tasks
- id: work
  speciality: worker
  abilities:
  - run_command
  - edit_files
  fan_out:
    over: tasks
    max: 20
    on_partial: continue
  outputs:
  - work_result
- id: verify
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
  outputs:
  - claims: list[{paper:any, section:any}]
  - output
  criteria: Every claim cites the specific paper and the section within it. A claim citing a paper but
    not where in it stops the next reader from verifying anything.
edges:
- from: plan
  to: work
- from: work
  to: verify
- from: verify
  to: work
  when: verify_failed and attempts < 3
termination:
  max_steps: 30
  contract: every claim cites a specific paper and section
verification:
- assert: all(c.paper and c.section for c in output.claims)
goal:
  required: true
  description: the research question to review and the inclusion criteria for screening
state:
  inputs:
  - goal
