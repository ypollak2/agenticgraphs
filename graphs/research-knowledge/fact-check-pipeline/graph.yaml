apiVersion: agr/v1.7
name: fact-check-pipeline
description: Decompose claims, verify each against sources, grade verdicts.
category: research-knowledge
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: produce
  speciality: producer
  abilities:
  - generate
  - web_search
  outputs:
  - verdicts: list[{quote_span:any, source_url:any}]
- id: review
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - output
edges:
- from: intake
  to: produce
- from: produce
  to: review
- from: review
  to: produce
  when: revision_requested and attempts < 2
termination:
  max_steps: 12
  contract: each verdict carries source URL and quote span
verification:
- assert: all(v.source_url and v.quote_span for v in output.verdicts)
goal:
  required: true
  description: the claims to check and the sources they may be checked against
state:
  inputs:
  - goal
