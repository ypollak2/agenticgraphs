apiVersion: agr/v1.8
name: citation-integrity-audit
description: Workers verify each citation exists and supports its claim.
category: research-knowledge
nodes:
- id: plan
  speciality: planner
  abilities:
  - decompose_goal
  outputs:
  - tasks
- id: work
  speciality: worker
  abilities:
  - run_command
  - edit_files
  fan_out:
    over: tasks
    max: 20
    on_partial: continue
  outputs:
  - work_result
  retries:
    max: 2
- id: verify
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
  outputs:
  - citations: list[{resolves:bool}]
  - output
  - verify_failed: bool
  criteria: Every citation resolves to a real, reachable source, and the cited passage actually supports
    the claim it is attached to. A resolving link under a claim it does not support is the harder failure
    and the one this node exists for.
  retries:
    max: 2
edges:
- from: plan
  to: work
- from: work
  to: verify
- from: verify
  to: work
  when: verify_failed and attempts < 3
termination:
  max_steps: 30
  contract: every citation resolves; mismatches listed
verification:
- assert: all(c.resolves for c in output.citations)
- describe: every citation URL is actually fetched; a link that resolves in prose does not resolve
  command: linkchecker --no-warnings {document_path}
goal:
  required: true
  description: the document whose citations to verify and the sources it cites
state:
  inputs:
  - goal
  - document_path
