apiVersion: agr/v1
name: competitive-intelligence
description: Scan competitor releases and filings, reduce to a delta brief.
category: research-knowledge
nodes:
- id: partition
  speciality: analyst
  abilities:
  - analyze
- id: map
  speciality: mapper
  abilities:
  - map_shard
  parallel_group: shards
- id: reduce
  speciality: reducer
  abilities:
  - reduce_merge
  kind: verifier
edges:
- from: partition
  to: map
- from: map
  to: reduce
termination:
  max_steps: 20
  contract: every finding links a dated public source
verification:
- assert: all(f.source_url and f.source_date for f in output.findings)
