apiVersion: agr/v1.8
name: competitive-intelligence
description: Scan competitor releases and filings, reduce to a delta brief.
category: research-knowledge
nodes:
- id: partition
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - shards
- id: map
  speciality: mapper
  abilities:
  - map_shard
  fan_out:
    over: shards
    max: 20
    on_partial: continue
  outputs:
  - shard_result
- id: reduce
  speciality: reducer
  abilities:
  - reduce_merge
  - web_search
  kind: verifier
  outputs:
  - findings: list[{source_date:any, source_url:any}]
  - output
  criteria: Every finding links a dated public source. An undated observation cannot be told apart from
    a stale one, which is the whole risk in a competitive brief.
  retries:
    max: 2
edges:
- from: partition
  to: map
- from: map
  to: reduce
termination:
  max_steps: 20
  contract: every finding links a dated public source
verification:
- assert: all(f.source_url and f.source_date for f in output.findings)
goal:
  required: true
  description: the competitors to profile and the decision the brief informs
state:
  inputs:
  - goal
