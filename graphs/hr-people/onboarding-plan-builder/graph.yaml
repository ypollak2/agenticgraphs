apiVersion: agr/v1.8
name: onboarding-plan-builder
description: Build a role-specific 30/60/90 plan from the JD, team context and access requirements, then
  verify coverage.
category: hr-people
nodes:
- id: gather
  speciality: analyst
  abilities:
  - analyze
  inputs:
  - role
  - team
  outputs:
  - role_context
- id: draft-plan
  speciality: producer
  abilities:
  - generate
  inputs:
  - role_context
  outputs:
  - plan_30_60_90
  parallel_group: gather-fanout
- id: access-map
  speciality: mapper
  abilities:
  - map_shard
  inputs:
  - role_context
  outputs:
  - access_requests
  parallel_group: gather-fanout
- id: review
  speciality: critic
  abilities:
  - critique
  kind: verifier
  inputs:
  - plan_30_60_90
  - access_requests
  outputs:
  - access_requests
  - output
  - plan_30_60_90
  join: all
  criteria: Each 30/60/90 checkpoint carries a milestone an observer could mark done or not done, and
    every system the role needs on day one is requested before the start date. 'Get up to speed' is not
    a milestone.
edges:
- from: gather
  to: draft-plan
- from: gather
  to: access-map
- from: draft-plan
  to: review
- from: access-map
  to: review
- from: review
  to: draft-plan
  when: not milestones_covered and attempts < 2
termination:
  max_steps: 25
  contract: every checkpoint carries a measurable milestone and day-one access is pre-requested
verification:
- describe: every checkpoint in the plan `draft-plan` produced carries a markable milestone
  assert: all(c.milestone for c in output.plan_30_60_90)
- describe: every access request names the system and when it was raised
  assert: all(a.system and a.requested_on for a in output.access_requests)
state:
  inputs:
  - goal
  - role
  - team
goal:
  required: true
  description: the new hire's role and the team they are joining
