apiVersion: agr/v1.1
name: jd-drafting-critic
description: Draft job descriptions, critic removes bias and inflation.
category: hr-people
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
- id: generate
  speciality: producer
  abilities:
  - generate
- id: critique
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - output
edges:
- from: intake
  to: generate
- from: generate
  to: critique
- from: critique
  to: generate
  when: rejected and attempts < 3
termination:
  max_steps: 10
  contract: bias-term lint clean; requirements deduplicated
verification:
- assert: output.bias_lint_clean and output.requirements_deduped
