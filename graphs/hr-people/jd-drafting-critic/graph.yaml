apiVersion: agr/v1.8
name: jd-drafting-critic
description: Draft job descriptions, critic removes bias and inflation.
category: hr-people
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: generate
  speciality: producer
  abilities:
  - generate
  outputs:
  - draft
  - requirements: list
- id: critique
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - bias_terms: list
  - output
  - unique_requirements: list
  - rejected: bool
  criteria: The description is clean of gendered and coded bias terms, and requirements are deduplicated
    and separated into must-have and nice-to-have. An inflated requirement list narrows the pool without
    raising the bar.
edges:
- from: intake
  to: generate
- from: generate
  to: critique
- from: critique
  to: generate
  when: rejected and attempts < 3
termination:
  max_steps: 10
  contract: bias-term lint clean; requirements deduplicated
verification:
- describe: "no gendered or coded term survives \u2014 the terms found, not a verdict that none were"
  assert: len(output.bias_terms) == 0
- describe: requirements are deduplicated, checked by counting rather than claiming
  assert: len(output.requirements) == len(output.unique_requirements)
goal:
  required: true
  description: the role to describe and the level and team it sits in
state:
  inputs:
  - goal
