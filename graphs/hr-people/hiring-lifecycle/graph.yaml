apiVersion: agr/v1.8
name: hiring-lifecycle
description: Draft a role, screen a pipeline, run a structured interview loop, and gate the offer on a
  panel decision.
category: hr-people
nodes:
- id: define-role
  speciality: supervisor
  kind: subgraph
  ref: hr-people/jd-drafting-critic
  inputs:
  - role_brief
  outputs:
  - bias_lint_clean: any
  - jd
  - requirements_deduped: any
- id: screen
  speciality: recruiter
  abilities:
  - screen
  inputs:
  - jd
  outputs:
  - shortlist
- id: interview
  speciality: analyst
  abilities:
  - analyze
  inputs:
  - shortlist
  outputs:
  - scorecards
- id: panel-decision
  speciality: approver
  kind: human
  abilities:
  - approve
  inputs:
  - scorecards
  outputs:
  - signed_off: any
  approval:
    contract: signed_off == true and len(scorecards) >= 3
    on_timeout: escalate
- id: offer
  speciality: executor
  abilities:
  - execute_step
  inputs:
  - signed_off
  outputs:
  - offer_sent
  - output
  - scorecard_count: int
  - structured
  unbound_ok: 'narrated: execute_step has no binding in this runtime; the effect is the model''s account
    of it until the ability is bound (audit 2026-09-04, Q1)'
- id: escalate-hiring
  speciality: escalator
  abilities:
  - escalate
  inputs: []
  outputs:
  - escalated: bool
  - escalation_reason
  criteria: The role is escalated with the shortlist and the scorecards actually collected. Fewer than
    three assessments is a decision that cannot be made, not a decision to reject.
  unbound_ok: 'narrated: escalate has no binding in this runtime; the effect is the model''s account of
    it until the ability is bound (audit 2026-09-04, Q1)'
edges:
- from: define-role
  to: screen
- from: screen
  to: interview
- from: interview
  to: screen
  when: len(shortlist) == 0 and attempts < 2
- from: interview
  to: panel-decision
  when: len(scorecards) >= 3
- from: panel-decision
  to: offer
- from: interview
  to: escalate-hiring
  when: len(scorecards) < 3 and attempts >= 2
termination:
  max_steps: 35
  contract: an offer requires at least three structured scorecards and a panel signature
verification:
- describe: no offer without a quorum of structured scorecards
  assert: output.scorecard_count >= 3
- describe: a panel, not a model, made the call
  assert: output.signed_off == true
state:
  inputs:
  - goal
  - role_brief
goal:
  required: true
  description: the role to fill and what a successful hire must be able to do
