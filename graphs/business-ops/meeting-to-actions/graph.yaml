apiVersion: agr/v1.8
name: meeting-to-actions
description: Transcript to decisions, owners, deadlines, and follow-ups.
category: business-ops
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: produce
  speciality: producer
  abilities:
  - generate
  outputs:
  - actions: list[{date:any, owner:any, quote:any}]
- id: review
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - output
  criteria: Each action names one accountable person rather than a team, a calendar date rather than a
    relative phrase like 'next week', and a verbatim transcript quote showing the commitment was actually
    made. Discussion that never became a commitment is not an action.
edges:
- from: intake
  to: produce
- from: produce
  to: review
- from: review
  to: produce
  when: revision_requested and attempts < 2
termination:
  max_steps: 12
  contract: each action has owner and date; quotes traceable
verification:
- assert: all(a.owner and a.date and a.quote for a in output.actions)
goal:
  required: true
  description: the meeting transcript to convert and the team it belongs to
state:
  inputs:
  - goal
