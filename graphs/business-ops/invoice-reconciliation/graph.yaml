apiVersion: agr/v1.8
name: invoice-reconciliation
description: Match invoices to POs and receipts cheapest-first, escalating only genuine exceptions to
  a human.
category: business-ops
nodes:
- id: auto-match
  speciality: supervisor
  kind: subgraph
  ref: finance/expense-audit-swarm
  inputs:
  - invoices
  outputs:
  - exceptions
  - matched
  - violations: list[{line_id:any, policy_rule:any}]
- id: fuzzy-match
  speciality: escalator
  abilities:
  - escalate
  - classify_complexity
  inputs:
  - exceptions
  outputs:
  - still_open
- id: ap-review
  speciality: approver
  kind: human
  abilities:
  - approve
  inputs:
  - still_open
  outputs:
  - signed_off
  approval:
    contract: signed_off == true
    on_timeout: escalate
- id: post
  speciality: controller
  abilities:
  - analyze
  inputs:
  - matched
  outputs:
  - matched
  - output
  - posted
  - unreviewed_exceptions
  join: any
edges:
- from: auto-match
  to: post
  when: len(exceptions) == 0
- from: auto-match
  to: fuzzy-match
  when: len(exceptions) > 0
- from: fuzzy-match
  to: post
  when: len(still_open) == 0
- from: fuzzy-match
  to: ap-review
  when: len(still_open) > 0
- from: ap-review
  to: post
termination:
  max_steps: 30
  contract: an unmatched invoice never posts without an AP signature
verification:
- describe: no exception reached posting unreviewed
  assert: output.unreviewed_exceptions == 0
- describe: "a three-way match names all three documents \u2014 invoice, PO and receipt. A match that\
    \ cannot say what it matched is a claim"
  assert: all(m.invoice_id and m.po_id and m.receipt_id for m in output.matched)
state:
  inputs:
  - goal
  - invoices
goal:
  required: true
  description: the invoice batch to reconcile and the period it covers
