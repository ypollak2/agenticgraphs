apiVersion: agr/v1.5
name: rfp-response-assembler
description: Answer each RFP requirement from a knowledge base, assemble.
category: business-ops
nodes:
- id: partition
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - shards
- id: map
  speciality: mapper
  abilities:
  - map_shard
  fan_out:
    over: shards
    max: 20
    on_partial: continue
  outputs:
  - shard_result
- id: reduce
  speciality: reducer
  abilities:
  - reduce_merge
  kind: verifier
  outputs:
  - output
  - page_count: float
  - page_limit: float
  - requirements: list[{answered:bool, flagged:bool}]
edges:
- from: partition
  to: map
- from: map
  to: reduce
termination:
  max_steps: 20
  contract: every requirement answered or flagged; page limit met
verification:
- assert: all(r.answered or r.flagged for r in output.requirements) and output.page_count <= output.page_limit
