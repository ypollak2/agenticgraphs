apiVersion: agr/v1.8
name: rfp-response-assembler
description: Answer each RFP requirement from a knowledge base, assemble.
category: business-ops
nodes:
- id: partition
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - shards
- id: map
  speciality: mapper
  abilities:
  - map_shard
  fan_out:
    over: shards
    max: 20
    on_partial: continue
  outputs:
  - shard_result
- id: reduce
  speciality: reducer
  abilities:
  - reduce_merge
  kind: verifier
  outputs:
  - output
  - page_count: float
  - requirements: list[{answered:bool, flagged:bool}]
  criteria: "Every numbered requirement is either answered from the knowledge base with its source, or\
    \ explicitly flagged as unanswerable \u2014 silence on a requirement is a failure, not an omission.\
    \ The assembled document is within the RFP's stated page limit."
  inputs:
  - page_limit
edges:
- from: partition
  to: map
- from: map
  to: reduce
termination:
  max_steps: 20
  contract: every requirement answered or flagged; page limit met
verification:
- assert: all(r.answered or r.flagged for r in output.requirements) and output.page_count <= output.page_limit
goal:
  required: true
  description: the RFP to answer and the knowledge base to answer it from
state:
  inputs:
  - goal
  - page_limit
