apiVersion: agr/v1
name: rfp-response-assembler
description: Answer each RFP requirement from a knowledge base, assemble.
category: business-ops
nodes:
- id: partition
  speciality: analyst
  abilities:
  - analyze
- id: map
  speciality: mapper
  abilities:
  - map_shard
  parallel_group: shards
- id: reduce
  speciality: reducer
  abilities:
  - reduce_merge
  kind: verifier
edges:
- from: partition
  to: map
- from: map
  to: reduce
termination:
  max_steps: 20
  contract: every requirement answered or flagged; page limit met
verification:
- assert: every requirement answered or flagged; page limit met
