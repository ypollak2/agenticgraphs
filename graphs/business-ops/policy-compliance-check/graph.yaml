apiVersion: agr/v1.8
name: policy-compliance-check
description: Check internal docs and processes against a policy set.
category: business-ops
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: produce
  speciality: producer
  abilities:
  - generate
  outputs:
  - findings: list[{clause_id:any}]
- id: review
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - output
  criteria: Each finding cites the specific policy clause id it breaches and quotes the document text
    that breaches it. A finding that restates a policy without pointing at non-compliant text is not a
    finding.
edges:
- from: intake
  to: produce
- from: produce
  to: review
- from: review
  to: produce
  when: revision_requested and attempts < 2
termination:
  max_steps: 12
  contract: findings map to specific policy clause ids
verification:
- assert: all(f.clause_id for f in output.findings)
goal:
  required: true
  description: the internal documents to check and the policy set to check them against
state:
  inputs:
  - goal
