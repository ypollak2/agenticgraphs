cases:
- id: happy-path
  node_outputs:
    collect.partition:
      shard_count: 1
    collect.map: {}
    collect.reduce:
      vendor_docs: []
      output:
        findings:
        - title: competitor launched feature X
          source_url: https://example.com/blog
          source_date: '2026-07-01'
    normalize:
      criteria_grid: []
    fill:
      matrix: matrix-value
    cite-check:
      uncited_cells: 0
      output:
        uncited_cells: 0
        criteria_consistent: true
        criteria_grid:
        - price
        - sso
        matrix:
        - criteria:
          - price
          - sso
          vendor: acme
      criteria_grid:
      - price
      - sso
      matrix:
      - criteria:
        - price
        - sso
        vendor: acme
  goal: compare Snowflake, BigQuery and Redshift for our warehouse migration
  inputs:
    vendors:
    - name: Snowflake
      doc_url: https://docs.snowflake.com/pricing
      notes: per-second compute billing
    - name: BigQuery
      doc_url: https://cloud.google.com/bigquery/pricing
      notes: on-demand bytes scanned
    - name: Redshift
      doc_url: https://docs.aws.amazon.com/redshift/pricing
      notes: provisioned RA3 nodes
    criteria:
    - pricing model
    - EU residency
    - SSO
    - max concurrency
