apiVersion: agr/v1.8
name: vendor-comparison-matrix
description: Build a like-for-like vendor matrix where every cell cites the source document it came from.
category: business-ops
nodes:
- id: collect
  speciality: supervisor
  kind: subgraph
  ref: research-knowledge/competitive-intelligence
  inputs:
  - vendors
  outputs:
  - findings: list[{source_date:any, source_url:any}]
  - vendor_docs
- id: normalize
  speciality: analyst
  abilities:
  - analyze
  inputs:
  - vendor_docs
  outputs:
  - criteria_grid: list
- id: fill
  speciality: reducer
  abilities:
  - reduce_merge
  inputs:
  - criteria_grid
  outputs:
  - matrix: list[{criteria:list, vendor:any}]
  fan_out:
    over: vendor_docs
- id: cite-check
  speciality: critic
  abilities:
  - critique
  kind: verifier
  inputs:
  - matrix
  outputs:
  - criteria_grid: list
  - matrix: list[{criteria:list, vendor:any}]
  - output
  - uncited_cells
  criteria: Every cell cites the vendor document and section it came from, and all vendors are scored
    on the identical criteria set. A criterion applied to one vendor but not another makes the matrix
    incomparable rather than merely incomplete.
edges:
- from: collect
  to: normalize
- from: normalize
  to: fill
- from: fill
  to: cite-check
- from: cite-check
  to: fill
  when: uncited_cells > 0 and attempts < 2
termination:
  max_steps: 25
  contract: every matrix cell cites its source and all vendors share one criteria set
verification:
- describe: no cell is uncited
  assert: output.uncited_cells == 0
- describe: every vendor row is scored on the criteria grid `normalize` produced
  assert: all(all(c in output.criteria_grid for c in r.criteria) for r in output.matrix)
state:
  inputs:
  - goal
  - vendors
goal:
  required: true
  description: the vendors to compare and the decision the matrix must inform
