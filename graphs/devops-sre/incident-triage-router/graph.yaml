apiVersion: agr/v1.4
name: incident-triage-router
description: Classify severity and route incidents to the owning team.
category: devops-sre
nodes:
- id: route
  speciality: dispatcher
  abilities:
  - dispatch
  kind: router
- id: branch-simple
  speciality: producer
  abilities:
  - generate
- id: branch-complex
  speciality: producer
  abilities:
  - generate
- id: verify
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - matches_ownership_map
  - output
edges:
- from: route
  to: branch-simple
  when: complexity <= moderate
- from: route
  to: branch-complex
  when: complexity > moderate
- from: branch-simple
  to: verify
- from: branch-complex
  to: verify
termination:
  max_steps: 12
  contract: routing matches on-call ownership map
verification:
- assert: output.matches_ownership_map
