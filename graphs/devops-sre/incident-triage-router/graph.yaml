apiVersion: agr/v1.7
name: incident-triage-router
description: Classify severity and route incidents to the owning team.
category: devops-sre
nodes:
- id: route
  speciality: dispatcher
  abilities:
  - dispatch
  kind: router
  outputs:
  - complexity
- id: branch-simple
  speciality: producer
  abilities:
  - generate
  outputs:
  - handled_by
- id: branch-complex
  speciality: producer
  abilities:
  - generate
  outputs:
  - handled_by
- id: verify
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - matches_ownership_map
  - output
edges:
- from: route
  to: branch-simple
  when: complexity <= moderate
- from: route
  to: branch-complex
  when: complexity > moderate
- from: branch-simple
  to: verify
- from: branch-complex
  to: verify
termination:
  max_steps: 12
  contract: routing matches on-call ownership map
verification:
- assert: output.matches_ownership_map
goal:
  required: true
  description: the incident to route and the on-call ownership map to route it by
state:
  inputs:
  - goal
