apiVersion: agr/v1.8
name: incident-lifecycle
description: Detect, triage, mitigate and prove an incident closed, then write the postmortem and file
  the actions.
category: devops-sre
nodes:
- id: detect
  speciality: analyst
  abilities:
  - analyze
  inputs:
  - alert
  outputs:
  - signal
  - blast_radius
- id: triage
  speciality: supervisor
  kind: subgraph
  ref: devops-sre/incident-triage-router
  inputs:
  - signal
  outputs:
  - owner
  - severity
  maps:
    severity: complexity
    owner: assigned_team
- id: mitigate
  speciality: sre
  abilities:
  - run_command
  inputs:
  - severity
  outputs:
  - mitigation
  - mitigated
  retries:
    max: 2
    reissue_effects: true
- id: confirm
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
  inputs:
  - mitigation
  outputs:
  - blast_radius
  - residual_blast_radius
  - impact_cleared: bool
  criteria: "Mitigation is proven by the signal that declared the incident returning to normal, not by\
    \ a responder saying so \u2014 and the postmortem yields at least one action with a named owner."
  retries:
    max: 2
    reissue_effects: true
- id: postmortem
  speciality: supervisor
  kind: subgraph
  ref: devops-sre/postmortem-writer
  inputs:
  - mitigation
  outputs:
  - postmortem
  - timeline: list[{log_id:any, message_id:any}]
  maps:
    postmortem: summary
- id: action-items
  speciality: planner
  abilities:
  - decompose_goal
  inputs:
  - postmortem
  outputs:
  - actions: list[{owner:any, task:any}]
  - output
- id: escalate-incident
  speciality: escalator
  abilities:
  - escalate
  inputs: []
  outputs:
  - escalated: bool
  - escalation_reason
  criteria: The incident is handed on with the mitigations tried and the signal that is still out of bounds.
    An incident nobody could clear is escalated, not closed.
  unbound_ok: 'narrated: escalate has no binding in this runtime; the effect is the model''s account of
    it until the ability is bound (audit 2026-09-04, Q1)'
edges:
- from: detect
  to: triage
- from: triage
  to: mitigate
- from: mitigate
  to: confirm
- from: confirm
  to: mitigate
  when: not impact_cleared and attempts < 3
- from: confirm
  to: postmortem
  when: impact_cleared
- from: postmortem
  to: action-items
- from: confirm
  to: escalate-incident
  when: not impact_cleared and attempts >= 3
termination:
  max_steps: 45
  contract: mitigation is proven effective before the postmortem is written; every postmortem yields owned
    actions
verification:
- describe: the blast radius measured after mitigation is smaller than the one `detect` measured before
    it
  assert: output.residual_blast_radius < output.blast_radius
- describe: the postmortem yields at least one owned action
  assert: len(output.actions) >= 1 and all(a.owner for a in output.actions)
state:
  inputs:
  - goal
  - alert
goal:
  required: true
  description: the alert to work and what 'resolved' means for this service
