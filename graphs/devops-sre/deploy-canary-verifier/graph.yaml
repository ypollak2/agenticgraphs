apiVersion: agr/v1
name: deploy-canary-verifier
description: Progressively shift traffic while checking error budgets.
category: devops-sre
nodes:
- id: attempt
  speciality: producer
  abilities:
  - generate
- id: measure
  speciality: evaluator
  abilities:
  - evaluate
  kind: verifier
edges:
- from: attempt
  to: measure
- from: measure
  to: attempt
  when: below_target and attempts < 5
termination:
  max_steps: 15
  contract: rollback fires when error rate exceeds threshold
verification:
- assert: rollback fires when error rate exceeds threshold
