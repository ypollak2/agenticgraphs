apiVersion: agr/v1.8
name: deploy-canary-verifier
description: Progressively shift traffic while checking error budgets.
category: devops-sre
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: attempt
  speciality: producer
  abilities:
  - generate
  outputs:
  - error_rate: float
  - rollback_fired: any
  - threshold: float
- id: measure
  speciality: evaluator
  abilities:
  - evaluate
  kind: verifier
  outputs:
  - output
  criteria: Either the canary's error rate stayed inside the budget, or the rollback fired. A canary that
    exceeded its threshold and was promoted anyway is the exact failure this node exists to catch.
edges:
- from: intake
  to: attempt
- from: attempt
  to: measure
- from: measure
  to: attempt
  when: below_target and attempts < 5
termination:
  max_steps: 15
  contract: rollback fires when error rate exceeds threshold
verification:
- assert: output.error_rate <= output.threshold or output.rollback_fired
triggers:
- 'on': signal
  expr: error_budget_burn > 2.0
budget:
  steps_max: 40
durability:
  checkpoint: every_node
  resume: true
goal:
  required: true
  description: the canary release to watch and the metrics that decide promotion
  supplied_by_trigger: true
state:
  inputs:
  - goal
