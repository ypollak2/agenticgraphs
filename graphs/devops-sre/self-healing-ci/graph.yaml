apiVersion: agr/v1.8
name: self-healing-ci
description: Diagnose a red pipeline, attempt a bounded repair, and accumulate what did not work across runs.
category: devops-sre
nodes:
- id: collect
  speciality: sre
  abilities:
  - run_command
  outputs:
  - failures
  inputs:
  - pipeline_run
  retries:
    max: 2
    reissue_effects: true
- id: classify
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - cause
  - known
  inputs:
  - failures
  - lessons
- id: repair
  speciality: executor
  abilities:
  - execute_step
  outputs:
  - repair_applied
  inputs:
  - cause
  unbound_ok: 'narrated: execute_step has no binding in this runtime; the effect is the model''s account of it until the ability
    is bound (audit 2026-09-04, Q1)'
- id: confirm
  speciality: verifier
  abilities:
  - run_command
  outputs:
  - escalated
  - lessons: list
  - output
  - pipeline_green: bool
  inputs:
  - repair_applied
  kind: verifier
  criteria: "The pipeline ends green, or escalates with the diagnosis attached \u2014 and every attempted repair is recorded\
    \ with why it failed, so the next run does not retry what already did not work."
  retries:
    max: 2
    reissue_effects: true
edges:
- from: collect
  to: classify
- from: classify
  to: repair
  condition: the failure has been classified and a cause proposed
  guidance: Fix the cause you identified, not the symptom in the log line. Keep your changes to what the diagnosis supports.
  pitfalls: rewriting the test so it accepts the current behaviour
- from: repair
  to: confirm
  condition: a repair has been made and needs verifying
  guidance: "Re-run the same check that failed and report what you learned from this cycle in writing \u2014 at least one\
    \ concrete takeaway a future run could act on, even when the fix worked first time. Keep the number of repair cycles small;\
    \ if two rounds have not fixed it, record what you learned and stop rather than continuing to try."
  pitfalls: finishing with an empty record of what was learned because the fix succeeded, or looping on repairs without writing
    anything down
- from: confirm
  to: classify
  when: not pipeline_green and attempts < 3
termination:
  max_steps: 20
  contract: a red pipeline ends green or escalated, never retried without a recorded reason
verification:
- describe: the pipeline is re-run to prove it is green, not reported green
  command: pytest -q
- describe: every attempt is recorded as a lesson, so the next run does not retry what already did not work
  assert: len(output.lessons) >= 1 and output.attempts <= 3
state:
  inputs:
  - goal
  - pipeline_run
  schema: state/lessons.schema.json
memory:
  scope: graph
triggers:
- 'on': webhook
  source: github
  event: workflow_run
budget:
  usd_max: 2.0
durability:
  checkpoint: every_node
  resume: true
goal:
  required: true
  description: the red pipeline run to diagnose and repair
  supplied_by_trigger: true
