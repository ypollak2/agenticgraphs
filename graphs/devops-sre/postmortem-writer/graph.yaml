apiVersion: agr/v1.5
name: postmortem-writer
description: Assemble timeline from logs and chat, draft blameless postmortem.
category: devops-sre
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: produce
  speciality: producer
  abilities:
  - generate
  outputs:
  - timeline: list[{log_id:any, message_id:any}]
- id: review
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - output
edges:
- from: intake
  to: produce
- from: produce
  to: review
- from: review
  to: produce
  when: revision_requested and attempts < 2
termination:
  max_steps: 12
  contract: every timeline event cites a log or message id
verification:
- assert: all(e.get('log_id') or e.get('message_id') for e in output.timeline)
