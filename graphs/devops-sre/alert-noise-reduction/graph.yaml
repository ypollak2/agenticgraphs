apiVersion: agr/v1.9
name: alert-noise-reduction
description: Cluster alerts, dedupe storms, emit one incident per cause.
category: devops-sre
nodes:
- id: partition
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - shards
- id: map
  speciality: mapper
  abilities:
  - map_shard
  fan_out:
    over: shards
    max: 20
    on_partial: continue
  outputs:
  - shard_result
- id: reduce
  speciality: reducer
  abilities:
  - reduce_merge
  kind: verifier
  outputs:
  - dedupe_ratio: int
  - missed_paging_alerts
  - output
  criteria: Clustering collapses a storm into one incident per underlying cause, and no alert that would have paged a human
    is suppressed. Missing one page outweighs any dedupe ratio.
edges:
- from: partition
  to: map
  condition: the incoming stream has been split into groups for parallel handling
  guidance: Keep signals that share an underlying cause in the same group. Splitting by arrival time or round-robin scatters
    one storm across several groups, and a worker that only sees a fragment cannot tell a repeat from a new event.
  pitfalls: splitting purely by volume so related signals land in different groups
- from: map
  to: reduce
  condition: each group has been summarised and the results are ready to merge
  guidance: "Collapse repeats that share a root cause into a single incident, and keep a count of what you folded together\
    \ so the reduction is visible rather than silent. Anything that would wake a human at 3am must survive the merge intact,\
    \ even when it looks like a repeat of something already folded \u2014 when you are unsure whether two signals are the\
    \ same, keep them apart."
  pitfalls: collapsing on surface similarity such as a shared hostname or message prefix, and letting an urgent signal disappear
    into a cluster it merely resembles
termination:
  max_steps: 6
  contract: dedupe ratio measured; no missed paging alert
verification:
- assert: output.dedupe_ratio > 0 and not output.missed_paging_alerts
triggers:
- 'on': schedule
  cron: 7 * * * *
budget:
  usd_max: 1.0
durability:
  checkpoint: every_node
  resume: true
goal:
  required: true
  description: the alert history to cluster and the window it covers
  supplied_by_trigger: true
state:
  inputs:
  - goal
  - alerts
