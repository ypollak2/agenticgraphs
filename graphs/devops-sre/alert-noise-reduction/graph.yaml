apiVersion: agr/v1
name: alert-noise-reduction
description: Cluster alerts, dedupe storms, emit one incident per cause.
category: devops-sre
nodes:
- id: partition
  speciality: analyst
  abilities:
  - analyze
- id: map
  speciality: mapper
  abilities:
  - map_shard
  parallel_group: shards
- id: reduce
  speciality: reducer
  abilities:
  - reduce_merge
  kind: verifier
edges:
- from: partition
  to: map
- from: map
  to: reduce
termination:
  max_steps: 20
  contract: dedupe ratio measured; no missed paging alert
verification:
- assert: output.dedupe_ratio > 0 and not output.missed_paging_alerts
