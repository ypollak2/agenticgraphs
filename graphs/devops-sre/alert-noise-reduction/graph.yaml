apiVersion: agr/v1.2
name: alert-noise-reduction
description: Cluster alerts, dedupe storms, emit one incident per cause.
category: devops-sre
nodes:
- id: partition
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - shards
- id: map
  speciality: mapper
  abilities:
  - map_shard
  fan_out:
    over: shards
    max: 20
    on_partial: continue
- id: reduce
  speciality: reducer
  abilities:
  - reduce_merge
  kind: verifier
  outputs:
  - output
edges:
- from: partition
  to: map
- from: map
  to: reduce
termination:
  max_steps: 20
  contract: dedupe ratio measured; no missed paging alert
verification:
- assert: output.dedupe_ratio > 0 and not output.missed_paging_alerts
