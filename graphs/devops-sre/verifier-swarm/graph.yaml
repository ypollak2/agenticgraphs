apiVersion: agr/v1.8
name: verifier-swarm
description: Planner fans work out to isolated workers; nothing merges until a verifier command proves
  the goal is done.
category: devops-sre
nodes:
- id: planner
  speciality: planner
  abilities:
  - decompose_goal
  outputs:
  - tasks
- id: worker
  speciality: worker
  abilities:
  - run_command
  - edit_files
  fan_out:
    over: tasks
    max: 20
    on_partial: continue
  outputs:
  - patched
  retries:
    max: 2
    reissue_effects: true
  unbound_ok: 'narrated: edit_files has no binding in this runtime; the effect is the model''s account
    of it until the ability is bound (audit 2026-09-04, Q1)'
- id: verifier
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
  outputs:
  - escalated
  - output
  - verify_failed: bool
  criteria: The goal's verification command exits zero against the merged result. Nothing merges on a
    worker's report that it finished; three failures escalate to a human rather than becoming a fourth
    attempt.
  retries:
    max: 2
    reissue_effects: true
edges:
- from: planner
  to: worker
- from: worker
  to: verifier
- from: verifier
  to: worker
  when: verify_failed and attempts < 3
termination:
  max_steps: 30
  contract: verifier command exits 0, or 3 failed attempts escalate to human
verification:
- describe: "the caller's own verification command exits 0 \u2014 the exit code is the fact, and nothing\
    \ merges before it"
  command: '{verify_command}'
- describe: 'the retry loop is bounded: three failures escalate rather than becoming a fourth attempt'
  assert: output.attempts <= 3
goal:
  required: true
  description: the goal to decompose and the command that proves it done
state:
  inputs:
  - goal
  - verify_command
