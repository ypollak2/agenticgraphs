cases:
- id: first-attempt-verified
  node_outputs:
    plan:
      steps:
      - exit_code: 1
    execute:
      step_result: &id001
        step: 1
        status: done
    verify:
      verify_failed: false
      attempts: 1
      output:
        steps:
        - id: s1
          exit_code: 0
  goal: the certificate rotation runbook, in staging
  inputs:
    postcondition_path: runbooks/checks/cert_rotation.sh
    runbook: &id002
      name: certificate rotation
      environment: staging
      steps:
      - n: 1
        cmd: acme renew --staging
      - n: 2
        cmd: deploy-certs --env staging
      - n: 3
        cmd: verify-tls --env staging
- id: retry-then-verified
  node_outputs:
    plan:
      steps:
      - exit_code: 1
    execute:
    - step_result: *id001
    - step_result: *id001
    verify:
    - verify_failed: true
      attempts: 1
    - verify_failed: false
      attempts: 2
      output:
        steps:
        - id: s1
          exit_code: 0
  goal: the certificate rotation runbook, in staging
  inputs:
    postcondition_path: runbooks/checks/cert_rotation.sh
    runbook: *id002
