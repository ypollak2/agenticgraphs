apiVersion: agr/v1.1
name: runbook-executor
description: Execute a runbook step-wise with post-condition checks.
category: devops-sre
nodes:
- id: plan
  speciality: planner
  abilities:
  - decompose_goal
- id: execute
  speciality: executor
  abilities:
  - execute_step
- id: verify
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
  outputs:
  - output
edges:
- from: plan
  to: execute
- from: execute
  to: verify
- from: verify
  to: execute
  when: verify_failed and attempts < 3
termination:
  max_steps: 25
  contract: each step post-condition command exits zero
verification:
- assert: all(s.exit_code == 0 for s in output.steps)
