apiVersion: agr/v1.8
name: runbook-executor
description: Execute a runbook step-wise with post-condition checks.
category: devops-sre
nodes:
- id: plan
  speciality: planner
  abilities:
  - decompose_goal
  outputs:
  - steps: list[{exit_code:int}]
- id: execute
  speciality: executor
  abilities:
  - execute_step
  outputs:
  - step_result
- id: verify
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
  outputs:
  - output
  criteria: Each step's post-condition command exited zero. A step whose check was skipped is not a passed
    step.
edges:
- from: plan
  to: execute
- from: execute
  to: verify
- from: verify
  to: execute
  when: verify_failed and attempts < 3
termination:
  max_steps: 25
  contract: each step post-condition command exits zero
verification:
- assert: all(s.exit_code == 0 for s in output.steps)
- describe: each step's post-condition is executed; a skipped check is not a passed step
  command: pytest -q {postcondition_path}
goal:
  required: true
  description: the runbook to execute and the environment to execute it in
state:
  inputs:
  - goal
  - postcondition_path
