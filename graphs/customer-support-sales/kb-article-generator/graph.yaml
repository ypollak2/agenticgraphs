apiVersion: agr/v1.8
name: kb-article-generator
description: Mine resolved tickets into draft knowledge-base articles.
category: customer-support-sales
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: dedupe-search
  speciality: researcher
  abilities:
  - web_search
  inputs:
  - summary
  outputs:
  - existing_articles
  criteria: The existing knowledge base is searched for the same symptom before anything is written. A
    near-duplicate is an article to update, not a second article to publish.
- id: produce
  speciality: producer
  abilities:
  - generate
  outputs:
  - duplicates_deduped: any
  - reproduces_resolution: any
- id: review
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - output
  criteria: "The steps, followed literally by someone who never saw the ticket, reproduce the resolution\
    \ \u2014 and the article does not duplicate an existing one covering the same symptom."
edges:
- from: intake
  to: dedupe-search
- from: dedupe-search
  to: produce
- from: produce
  to: review
- from: review
  to: produce
  when: revision_requested and attempts < 2
termination:
  max_steps: 12
  contract: steps reproduce resolution; duplicates deduped
verification:
- assert: output.reproduces_resolution and output.duplicates_deduped
goal:
  required: true
  description: the resolved ticket to write up and the audience for the article
state:
  inputs:
  - goal
