apiVersion: agr/v1
name: kb-article-generator
description: Mine resolved tickets into draft knowledge-base articles.
category: customer-support-sales
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
- id: produce
  speciality: producer
  abilities:
  - generate
- id: review
  speciality: critic
  abilities:
  - critique
  kind: verifier
edges:
- from: intake
  to: produce
- from: produce
  to: review
- from: review
  to: produce
  when: revision_requested and attempts < 2
termination:
  max_steps: 12
  contract: steps reproduce resolution; duplicates deduped
verification:
- assert: output.reproduces_resolution and output.duplicates_deduped
