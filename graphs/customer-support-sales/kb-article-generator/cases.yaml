cases:
  - id: happy-path
    node_outputs:
      intake: {summary: "intake complete"}
      produce: {output: {'steps': ['restart service', 'clear cache'], 'reproduces_resolution': True, 'duplicates_deduped': True}}
      review: {revision_requested: false, attempts: 1}
  - id: retry-then-resolved
    node_outputs:
      intake: {summary: "intake complete"}
      produce:
        - {output: {'steps': [], 'reproduces_resolution': False, 'duplicates_deduped': False}}
        - {output: {'steps': ['restart service', 'clear cache'], 'reproduces_resolution': True, 'duplicates_deduped': True}}
      review:
        - {revision_requested: true, attempts: 1}
        - {revision_requested: false, attempts: 2}
