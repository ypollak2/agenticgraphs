cases:
  - id: happy-path
    node_outputs:
      intake: {summary: "intake complete"}
      produce: {output: {'asks': [{'text': 'refund status', 'quote': 'customer said ...'}], 'all_asks_covered': True}}
      review: {revision_requested: false, attempts: 1}
  - id: retry-then-resolved
    node_outputs:
      intake: {summary: "intake complete"}
      produce:
        - {output: {'asks': [{'text': 'refund status', 'quote': ''}], 'all_asks_covered': False}}
        - {output: {'asks': [{'text': 'refund status', 'quote': 'customer said ...'}], 'all_asks_covered': True}}
      review:
        - {revision_requested: true, attempts: 1}
        - {revision_requested: false, attempts: 2}
