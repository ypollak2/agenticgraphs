apiVersion: agr/v1.7
name: escalation-summarizer
description: Compress long threads into handoff briefs with state.
category: customer-support-sales
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: produce
  speciality: producer
  abilities:
  - generate
  outputs:
  - all_asks_covered: any
  - asks: list[{quote:any}]
- id: review
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - output
edges:
- from: intake
  to: produce
- from: produce
  to: review
- from: review
  to: produce
  when: revision_requested and attempts < 2
termination:
  max_steps: 12
  contract: brief covers all unresolved asks; quotes traceable
verification:
- assert: output.all_asks_covered and all(a.quote for a in output.asks)
