apiVersion: agr/v1.8
name: escalation-summarizer
description: Compress long threads into handoff briefs with state.
category: customer-support-sales
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: produce
  speciality: producer
  abilities:
  - generate
  outputs:
  - all_asks_covered: any
  - asks: list[{quote:any}]
- id: review
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - output
  - revision_requested: bool
  criteria: Every unresolved customer ask appears in the brief with a verbatim quote and its current state.
    An ask the thread left hanging is exactly what the receiving tier must not have to rediscover.
edges:
- from: intake
  to: produce
- from: produce
  to: review
- from: review
  to: produce
  when: revision_requested and attempts < 2
termination:
  max_steps: 12
  contract: brief covers all unresolved asks; quotes traceable
verification:
- assert: output.all_asks_covered and all(a.quote for a in output.asks)
goal:
  required: true
  description: the support thread to summarize and the tier receiving it
state:
  inputs:
  - goal
