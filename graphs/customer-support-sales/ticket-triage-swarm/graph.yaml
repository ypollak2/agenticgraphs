apiVersion: agr/v1
name: ticket-triage-swarm
description: Classify and route tickets with priority and sentiment.
category: customer-support-sales
nodes:
- id: route
  speciality: dispatcher
  abilities:
  - dispatch
  kind: router
- id: branch-simple
  speciality: producer
  abilities:
  - generate
- id: branch-complex
  speciality: producer
  abilities:
  - generate
- id: verify
  speciality: critic
  abilities:
  - critique
  kind: verifier
edges:
- from: route
  to: branch-simple
  when: complexity <= moderate
- from: route
  to: branch-complex
  when: complexity > moderate
- from: branch-simple
  to: verify
- from: branch-complex
  to: verify
termination:
  max_steps: 12
  contract: routing accuracy measured on labeled backlog
verification:
- assert: output.routing_correct
