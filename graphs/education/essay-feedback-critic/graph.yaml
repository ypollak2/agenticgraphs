apiVersion: agr/v1.7
name: essay-feedback-critic
description: Rubric-based feedback with evidence quotes from the essay.
category: education
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: generate
  speciality: producer
  abilities:
  - generate
  outputs:
  - draft
- id: critique
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - comments: list[{quote:any, rubric_id:any}]
  - output
edges:
- from: intake
  to: generate
- from: generate
  to: critique
- from: critique
  to: generate
  when: rejected and attempts < 3
termination:
  max_steps: 10
  contract: every comment quotes essay text; rubric ids cited
verification:
- assert: all(c.quote and c.rubric_id for c in output.comments)
goal:
  required: true
  description: the essay to critique and the assignment brief it answers
state:
  inputs:
  - goal
