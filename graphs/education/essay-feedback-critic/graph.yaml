apiVersion: agr/v1
name: essay-feedback-critic
description: Rubric-based feedback with evidence quotes from the essay.
category: education
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
- id: generate
  speciality: producer
  abilities:
  - generate
- id: critique
  speciality: critic
  abilities:
  - critique
  kind: verifier
edges:
- from: intake
  to: generate
- from: generate
  to: critique
- from: critique
  to: generate
  when: rejected and attempts < 3
termination:
  max_steps: 10
  contract: every comment quotes essay text; rubric ids cited
verification:
- assert: all(c.quote and c.rubric_id for c in output.comments)
