apiVersion: agr/v1.4
name: quiz-generation-verified
description: Generate items, critic solves them blind to verify keys.
category: education
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
- id: generate
  speciality: producer
  abilities:
  - generate
- id: critique
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - entries
  - output
edges:
- from: intake
  to: generate
- from: generate
  to: critique
- from: critique
  to: generate
  when: rejected and attempts < 3
termination:
  max_steps: 10
  contract: critic answers match keys; distractors plausible
verification:
- assert: all(i.answer_matches_key and i.distractors_plausible for i in output.entries)
