apiVersion: agr/v1.8
name: quiz-generation-verified
description: Generate items, critic solves them blind to verify keys.
category: education
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: generate
  speciality: producer
  abilities:
  - generate
  outputs:
  - draft
- id: critique
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - entries: list[{answer_matches_key:any, distractors_plausible:any}]
  - output
  criteria: "The critic, solving each item without seeing the key, arrives at the keyed answer \u2014\
    \ and each distractor is wrong for a reason a learner could plausibly hold, not obviously absurd."
edges:
- from: intake
  to: generate
- from: generate
  to: critique
- from: critique
  to: generate
  when: rejected and attempts < 3
termination:
  max_steps: 10
  contract: critic answers match keys; distractors plausible
verification:
- assert: all(i.answer_matches_key and i.distractors_plausible for i in output.entries)
goal:
  required: true
  description: the source material to quiz on and the level of the learners
state:
  inputs:
  - goal
