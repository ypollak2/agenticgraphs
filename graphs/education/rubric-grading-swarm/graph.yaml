apiVersion: agr/v1.8
name: rubric-grading-swarm
description: Independent graders score, disagreements auto-escalate.
category: education
nodes:
- id: plan
  speciality: planner
  abilities:
  - decompose_goal
  outputs:
  - tasks
- id: work
  speciality: worker
  abilities:
  - run_command
  - edit_files
  fan_out:
    over: tasks
    max: 20
    on_partial: continue
  outputs:
  - work_result
  retries:
    max: 2
- id: verify
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
  outputs:
  - agreement: float
  - escalated: any
  - output
  - threshold: float
  criteria: Inter-rater agreement clears the threshold, or the submission escalates to a human. Averaging
    graders who disagree produces a defensible-looking number from an undefended judgement.
  retries:
    max: 2
edges:
- from: plan
  to: work
- from: work
  to: verify
- from: verify
  to: work
  when: verify_failed and attempts < 3
termination:
  max_steps: 30
  contract: inter-rater agreement above threshold or escalated
verification:
- assert: output.agreement >= output.threshold or output.escalated
goal:
  required: true
  description: the submissions to grade and the rubric to grade them against
state:
  inputs:
  - goal
