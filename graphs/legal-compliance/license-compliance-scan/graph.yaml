apiVersion: agr/v1.8
name: license-compliance-scan
description: Scan dependency licenses, reduce to obligations report.
category: legal-compliance
nodes:
- id: partition
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - shards
- id: map
  speciality: mapper
  abilities:
  - map_shard
  fan_out:
    over: shards
    max: 20
    on_partial: continue
  outputs:
  - shard_result
- id: reduce
  speciality: reducer
  abilities:
  - reduce_merge
  kind: verifier
  outputs:
  - copyleft_conflicts
  - output
  - packages: list[{spdx:any}]
  criteria: Every package resolves to an SPDX identifier, and any copyleft obligation incompatible with
    the distribution model is flagged. A package whose licence could not be determined is a conflict until
    proven otherwise.
edges:
- from: partition
  to: map
- from: map
  to: reduce
termination:
  max_steps: 20
  contract: SPDX ids resolved; copyleft conflicts flagged
verification:
- assert: all(p.spdx for p in output.packages) and not output.copyleft_conflicts
goal:
  required: true
  description: the dependency set to scan and the licence policy it must satisfy
state:
  inputs:
  - goal
