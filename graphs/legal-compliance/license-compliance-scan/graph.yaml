apiVersion: agr/v1
name: license-compliance-scan
description: Scan dependency licenses, reduce to obligations report.
category: legal-compliance
nodes:
- id: partition
  speciality: analyst
  abilities:
  - analyze
- id: map
  speciality: mapper
  abilities:
  - map_shard
  parallel_group: shards
- id: reduce
  speciality: reducer
  abilities:
  - reduce_merge
  kind: verifier
edges:
- from: partition
  to: map
- from: map
  to: reduce
termination:
  max_steps: 20
  contract: SPDX ids resolved; copyleft conflicts flagged
verification:
- assert: SPDX ids resolved; copyleft conflicts flagged
