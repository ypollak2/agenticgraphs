apiVersion: agr/v1.1
name: contract-redline-pipeline
description: Compare against playbook, propose redlines with rationale.
category: legal-compliance
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
- id: produce
  speciality: producer
  abilities:
  - generate
- id: review
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - output
edges:
- from: intake
  to: produce
- from: produce
  to: review
- from: review
  to: produce
  when: revision_requested and attempts < 2
termination:
  max_steps: 12
  contract: every redline cites a playbook position
verification:
- assert: all(r.playbook_ref for r in output.redlines)
