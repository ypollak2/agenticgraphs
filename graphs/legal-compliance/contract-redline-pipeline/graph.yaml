apiVersion: agr/v1.7
name: contract-redline-pipeline
description: Compare against playbook, propose redlines with rationale.
category: legal-compliance
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: produce
  speciality: producer
  abilities:
  - generate
  outputs:
  - redlines: list[{playbook_ref:any}]
- id: review
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - output
edges:
- from: intake
  to: produce
- from: produce
  to: review
- from: review
  to: produce
  when: revision_requested and attempts < 2
termination:
  max_steps: 12
  contract: every redline cites a playbook position
verification:
- assert: all(r.playbook_ref for r in output.redlines)
goal:
  required: true
  description: the contract to redline and the playbook of acceptable positions
state:
  inputs:
  - goal
