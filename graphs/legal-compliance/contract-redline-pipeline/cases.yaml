cases:
- id: happy-path
  node_outputs:
    intake:
      summary: intake complete
    produce:
      output:
        redlines:
        - clause: limitation of liability
          playbook_ref: PB-4
    review:
      revision_requested: false
      attempts: 1
    playbook-lookup: &id001
      playbook_positions:
      - clause: indemnity
        position: mutual
  goal: the Meridian MSA, against the 2026 commercial playbook
  inputs:
    contract: &id002
      name: Meridian MSA
      clauses:
      - id: m1
        type: liability_cap
        text: Unlimited liability for all claims.
      - id: m2
        type: payment_terms
        text: Net 90 from invoice.
      - id: m3
        type: termination
        text: Termination for convenience with 180 days notice.
    playbook: &id003
      year: 2026
      positions:
      - playbook_ref: PB-2
        rule: cap at 12 months fees
      - playbook_ref: PB-5
        rule: Net 30 standard, Net 45 maximum
      - playbook_ref: PB-8
        rule: termination for convenience at 60 days
- id: retry-then-resolved
  node_outputs:
    intake:
      summary: intake complete
    produce:
    - output:
        redlines:
        - clause: limitation of liability
          playbook_ref: ''
    - output:
        redlines:
        - clause: limitation of liability
          playbook_ref: PB-4
    review:
    - revision_requested: true
      attempts: 1
    - revision_requested: false
      attempts: 2
    playbook-lookup: *id001
  goal: the Meridian MSA, against the 2026 commercial playbook
  inputs:
    contract: *id002
    playbook: *id003
