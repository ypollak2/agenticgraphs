apiVersion: agr/v1.9
name: contract-lifecycle
description: Intake a contract, redline it, gate on residual risk, and execute only with counsel approval.
category: legal-compliance
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  inputs:
  - contract
  outputs:
  - clauses
- id: redline
  speciality: supervisor
  kind: subgraph
  ref: legal-compliance/contract-redline-pipeline
  inputs:
  - clauses
  outputs:
  - redlines: list[{playbook_ref:any}]
- id: risk-assess
  speciality: counsel
  abilities:
  - critique
  - analyze
  inputs:
  - redlines
  outputs:
  - residual_risk
- id: counsel-approval
  speciality: approver
  kind: human
  abilities:
  - approve
  inputs:
  - residual_risk
  outputs:
  - signed_off: any
  approval:
    contract: signed_off == true and residual_risk <= medium
    on_timeout: escalate
- id: execute
  speciality: executor
  abilities:
  - execute_step
  inputs:
  - signed_off
  outputs:
  - output
  - residual_risk_level
  - signatures: list[{party:any, dated:any}]
  unbound_ok: 'narrated: execute_step has no binding in this runtime; the effect is the model''s account of it until the ability
    is bound (audit 2026-09-04, Q1)'
- id: escalate-contract
  speciality: escalator
  abilities:
  - escalate
  inputs: []
  outputs:
  - escalated: bool
  - escalation_reason
  criteria: The contract escalates with the residual risk that redlining could not reduce. Risk above appetite is a decision
    for counsel, not a blocked graph.
  unbound_ok: 'narrated: escalate has no binding in this runtime; the effect is the model''s account of it until the ability
    is bound (audit 2026-09-04, Q1)'
edges:
- from: intake
  to: redline
- from: redline
  to: risk-assess
- from: risk-assess
  to: redline
  when: residual_risk > medium and attempts < 2
- from: risk-assess
  to: counsel-approval
  when: residual_risk <= medium
  condition: the redlines are settled and the residual risk has been assessed
  guidance: State the remaining exposure in the same terms as the appetite you were given, so the two can be compared directly
    rather than interpreted.
  pitfalls: describing risk in prose that cannot be checked against the stated appetite
- from: counsel-approval
  to: execute
  condition: approval has been given and the agreement is ready to complete
  guidance: "Every signing block must record both who signed it and the date they signed \u2014 an entry missing either one\
    \ is not executed, however clearly the rest reads. Complete one for everyone who has to sign."
  pitfalls: recording a name with no date, or a date with no name, and treating the agreement as complete
- from: risk-assess
  to: escalate-contract
  when: residual_risk > medium and attempts >= 2
termination:
  max_steps: 16
  contract: a contract executes only at or below medium residual risk with counsel signature
verification:
- describe: "every signature names its party and its date \u2014 an executed contract is one both sides signed, which is checkable"
  assert: all(s.party and s.dated for s in output.signatures)
- describe: residual risk landed inside appetite
  assert: output.residual_risk_level in ['low','medium']
- describe: counsel signed off
  assert: output.signed_off == true
state:
  inputs:
  - goal
  - contract
goal:
  required: true
  description: the contract to review and the risk posture to hold it to
