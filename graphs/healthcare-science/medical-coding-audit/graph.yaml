apiVersion: agr/v1
name: medical-coding-audit
description: Workers verify diagnosis and procedure codes against notes.
category: healthcare-science
nodes:
- id: plan
  speciality: planner
  abilities:
  - decompose_goal
- id: work
  speciality: worker
  abilities:
  - run_command
  - edit_files
  parallel_group: swarm
- id: verify
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
edges:
- from: plan
  to: work
- from: work
  to: verify
- from: verify
  to: work
  when: verify_failed and attempts < 3
termination:
  max_steps: 30
  contract: code assignments justified by note spans
verification:
- assert: code assignments justified by note spans
