apiVersion: agr/v1.8
name: trial-eligibility-screener
description: Screen patients against trial criteria cheapest-first, escalating ambiguous cases to a clinician.
category: healthcare-science
nodes:
- id: prefilter
  speciality: screener
  abilities:
  - screen
  inputs:
  - patient_records
  outputs:
  - obvious_excludes
- id: criteria-match
  speciality: analyst
  abilities:
  - analyze
  inputs:
  - obvious_excludes
  outputs:
  - matched
  - ambiguous
- id: deep-review
  speciality: escalator
  abilities:
  - escalate
  - classify_complexity
  inputs:
  - ambiguous
  outputs:
  - escalated_cases
  unbound_ok: 'narrated: escalate has no binding in this runtime; the effect is the model''s account of
    it until the ability is bound (audit 2026-09-04, Q1)'
- id: clinician-review
  speciality: approver
  kind: human
  abilities:
  - approve
  inputs:
  - escalated_cases
  outputs:
  - signed_off
  approval:
    contract: signed_off == true
    on_timeout: escalate
- id: enrol
  speciality: executor
  abilities:
  - execute_step
  inputs:
  - matched
  outputs:
  - enrolled
  - output
  - unreviewed_ambiguous: int
  join: any
  unbound_ok: 'narrated: execute_step has no binding in this runtime; the effect is the model''s account
    of it until the ability is bound (audit 2026-09-04, Q1)'
edges:
- from: prefilter
  to: criteria-match
- from: criteria-match
  to: enrol
  when: len(ambiguous) == 0
- from: criteria-match
  to: deep-review
  when: len(ambiguous) > 0
- from: deep-review
  to: clinician-review
- from: clinician-review
  to: enrol
termination:
  max_steps: 30
  contract: an ambiguous eligibility decision never enrols without a clinician signature
verification:
- describe: no ambiguous case is enrolled without clinician review
  assert: output.unreviewed_ambiguous == 0
state:
  inputs:
  - goal
  - patient_records
goal:
  required: true
  description: the trial to screen against and the cohort to screen
