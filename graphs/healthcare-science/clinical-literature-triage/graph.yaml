apiVersion: agr/v1
name: clinical-literature-triage
description: Route new papers by study type and evidence level.
category: healthcare-science
nodes:
- id: route
  speciality: dispatcher
  abilities:
  - dispatch
  kind: router
- id: branch-simple
  speciality: producer
  abilities:
  - generate
- id: branch-complex
  speciality: producer
  abilities:
  - generate
- id: verify
  speciality: critic
  abilities:
  - critique
  kind: verifier
edges:
- from: route
  to: branch-simple
  when: complexity <= moderate
- from: route
  to: branch-complex
  when: complexity > moderate
- from: branch-simple
  to: verify
- from: branch-complex
  to: verify
termination:
  max_steps: 12
  contract: labels match a validated sample set
verification:
- assert: labels match a validated sample set
