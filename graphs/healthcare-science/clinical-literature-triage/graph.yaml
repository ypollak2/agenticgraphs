apiVersion: agr/v1.8
name: clinical-literature-triage
description: Route new papers by study type and evidence level.
category: healthcare-science
nodes:
- id: route
  speciality: dispatcher
  abilities:
  - dispatch
  kind: router
  outputs:
  - complexity
- id: branch-simple
  speciality: producer
  abilities:
  - generate
  outputs:
  - assigned_evidence_level
- id: branch-complex
  speciality: producer
  abilities:
  - generate
  outputs:
  - assigned_evidence_level
- id: verify
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - expected_evidence_level
  - assigned_evidence_level
  - output
  criteria: The study-type and evidence-level labels agree with the validated sample, and the level reflects
    the study design as reported rather than the strength of its conclusions.
  inputs:
  - validated_labels
edges:
- from: route
  to: branch-simple
  when: complexity <= moderate
- from: route
  to: branch-complex
  when: complexity > moderate
- from: branch-simple
  to: verify
- from: branch-complex
  to: verify
termination:
  max_steps: 12
  contract: labels match a validated sample set
verification:
- describe: the decision agrees with the validated labels the caller supplied
  assert: output.assigned_evidence_level == output.expected_evidence_level
- describe: the reference was actually consulted, not left empty
  assert: len(output.expected_evidence_level) > 0
goal:
  required: true
  description: the papers to triage and the evidence hierarchy to rank them by
state:
  inputs:
  - goal
  - validated_labels
