apiVersion: agr/v1.8
name: clinical-protocol-lifecycle
description: Draft a study protocol, critique it against guidance, and register it only after investigator
  sign-off.
category: healthcare-science
nodes:
- id: draft
  speciality: producer
  abilities:
  - generate
  inputs:
  - study_goal
  outputs:
  - protocol
- id: critique
  speciality: critic
  abilities:
  - critique
  inputs:
  - protocol
  outputs:
  - deviations
- id: revise
  speciality: producer
  abilities:
  - generate
  inputs:
  - deviations
  outputs:
  - protocol_final
- id: investigator-signoff
  speciality: approver
  kind: human
  abilities:
  - approve
  inputs:
  - protocol_final
  outputs:
  - signed_off: any
  approval:
    contract: signed_off == true and len(deviations) == 0
    on_timeout: escalate
- id: register
  speciality: controller
  abilities:
  - analyze
  - file_record
  inputs:
  - signed_off
  outputs:
  - output
  - registered
  - registry_id: any
  - register_failed: bool
  unbound_ok: 'narrated: file_record has no binding in this runtime; the effect is the model''s account
    of it until the ability is bound (audit 2026-09-04, Q1)'
- id: amend-registration
  speciality: compensator
  abilities:
  - rollback
  inputs: []
  outputs:
  - amend_registration_filed
  criteria: A trial registration is public and permanent. The compensating action is a posted amendment
    explaining the change, because a silently altered protocol is the thing registration exists to prevent.
  unbound_ok: 'narrated: rollback has no binding in this runtime; the effect is the model''s account of
    it until the ability is bound (audit 2026-09-04, Q1)'
edges:
- from: draft
  to: critique
- from: critique
  to: revise
  when: len(deviations) > 0
- from: revise
  to: critique
  when: attempts < 3
- from: critique
  to: investigator-signoff
  when: len(deviations) == 0
- from: investigator-signoff
  to: register
- from: register
  to: amend-registration
  kind: compensate
  when: register_failed
termination:
  max_steps: 35
  contract: a protocol registers only with zero open deviations and a named investigator signature
verification:
- describe: no unresolved guidance deviations at registration
  assert: len(output.deviations) == 0
- describe: a named investigator signed the protocol
  assert: output.signed_off == true
- describe: registration returned an id
  assert: output.registry_id is not None
state:
  inputs:
  - goal
  - study_goal
goal:
  required: true
  description: the study question the protocol must answer
