apiVersion: agr/v1.8
name: differential-diagnosis-ensemble
description: Independent diagnosticians rank hypotheses; a quorum decides and dissent is reported, never
  dropped.
category: healthcare-science
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - presentations
  inputs:
  - case_notes
- id: diagnose
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - ranking: list[{clinician_id:any}]
  inputs:
  - presentations
  fan_out:
    over: presentations
    max: 5
    on_partial: continue
- id: adjudicate
  speciality: judge
  abilities:
  - adjudicate
  outputs:
  - consensus
  - dissent
  - output
  - ranking: list[{clinician_id:any}]
  - represented
  inputs:
  - ranking
  join: quorum(1)
  aggregate:
    op: majority
    over: ranking
  kind: verifier
  criteria: The ranked differential carries the quorum supporting it, and any diagnostician's dissent
    is reported alongside. The rare diagnosis one reviewer insisted on is the signal, not the noise.
edges:
- from: intake
  to: diagnose
- from: diagnose
  to: adjudicate
termination:
  max_steps: 30
  contract: a diagnosis carries its quorum; disagreement is reported rather than averaged away
verification:
- describe: a consensus or a recorded disagreement, never neither
  assert: output.consensus is not None or len(output.dissent) > 0
- describe: "every ranked hypothesis is represented in the adjudication \u2014 dissent is carried, not\
    \ averaged away"
  assert: all(r.clinician_id in output.represented for r in output.ranking)
state:
  inputs:
  - goal
  - case_notes
goal:
  required: true
  description: the presenting case and the history available to reason from
