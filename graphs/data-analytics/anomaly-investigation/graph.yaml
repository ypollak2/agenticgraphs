apiVersion: agr/v1
name: anomaly-investigation
description: Route metric anomalies to seasonal, data-bug, or real-change analysts.
category: data-analytics
nodes:
- id: route
  speciality: dispatcher
  abilities:
  - dispatch
  kind: router
- id: branch-simple
  speciality: producer
  abilities:
  - generate
- id: branch-complex
  speciality: producer
  abilities:
  - generate
- id: verify
  speciality: critic
  abilities:
  - critique
  kind: verifier
edges:
- from: route
  to: branch-simple
  when: complexity <= moderate
- from: route
  to: branch-complex
  when: complexity > moderate
- from: branch-simple
  to: verify
- from: branch-complex
  to: verify
termination:
  max_steps: 12
  contract: classification agrees with holdout labels
verification:
- assert: output.matches_holdout
