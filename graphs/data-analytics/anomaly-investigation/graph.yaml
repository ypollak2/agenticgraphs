apiVersion: agr/v1.8
name: anomaly-investigation
description: Route metric anomalies to seasonal, data-bug, or real-change analysts.
category: data-analytics
nodes:
- id: route
  speciality: dispatcher
  abilities:
  - dispatch
  kind: router
  outputs:
  - complexity
- id: branch-simple
  speciality: producer
  abilities:
  - generate
  outputs:
  - assigned_class
- id: branch-complex
  speciality: producer
  abilities:
  - generate
  outputs:
  - assigned_class
- id: verify
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - expected_class
  - assigned_class
  - output
  criteria: The classification into seasonal, data-bug or real-change agrees with the holdout labels,
    and cites the comparison window and series that distinguishes the three. Every anomaly looks real
    without the seasonal baseline beside it.
  inputs:
  - holdout_labels
edges:
- from: route
  to: branch-simple
  when: complexity <= moderate
- from: route
  to: branch-complex
  when: complexity > moderate
- from: branch-simple
  to: verify
- from: branch-complex
  to: verify
termination:
  max_steps: 12
  contract: classification agrees with holdout labels
verification:
- describe: the decision agrees with the holdout labels the caller supplied
  assert: output.assigned_class == output.expected_class
- describe: the reference was actually consulted, not left empty
  assert: len(output.expected_class) > 0
goal:
  required: true
  description: the metric anomaly to investigate and the window it appeared in
state:
  inputs:
  - goal
  - holdout_labels
