apiVersion: agr/v1.7
name: anomaly-investigation
description: Route metric anomalies to seasonal, data-bug, or real-change analysts.
category: data-analytics
nodes:
- id: route
  speciality: dispatcher
  abilities:
  - dispatch
  kind: router
  outputs:
  - complexity
- id: branch-simple
  speciality: producer
  abilities:
  - generate
  outputs:
  - handled_by
- id: branch-complex
  speciality: producer
  abilities:
  - generate
  outputs:
  - handled_by
- id: verify
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - matches_holdout
  - output
edges:
- from: route
  to: branch-simple
  when: complexity <= moderate
- from: route
  to: branch-complex
  when: complexity > moderate
- from: branch-simple
  to: verify
- from: branch-complex
  to: verify
termination:
  max_steps: 12
  contract: classification agrees with holdout labels
verification:
- assert: output.matches_holdout
goal:
  required: true
  description: the metric anomaly to investigate and the window it appeared in
state:
  inputs:
  - goal
