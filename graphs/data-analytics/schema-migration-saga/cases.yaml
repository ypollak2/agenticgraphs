cases:
- id: happy-path
  node_outputs:
    plan:
      migration_plan: migration_plan-value
    shadow-write:
      shadow_active: true
    backfill:
      backfill_complete: backfill_complete-value
    cutover:
      cutover_done: cutover_done-value
    verify:
      parity_verified: true
      output: &id001
        parity_verified: true
        consistent: false
    undo-cutover:
      cutover_undone: cutover_undone-value
    undo-backfill:
      backfill_undone: backfill_undone-value
    undo-shadow:
      shadow_undone: shadow_undone-value
      consistent: false
      output: *id001
  goal: migrate the orders schema to the normalized v3 shape without downtime
