apiVersion: agr/v1.8
name: schema-migration-saga
description: Migrate a schema in four reversible steps; any failure compensates back to a consistent state.
category: data-analytics
nodes:
- id: plan
  speciality: planner
  abilities:
  - decompose_goal
  inputs:
  - source_schema
  outputs:
  - migration_plan
- id: shadow-write
  speciality: migrator
  abilities:
  - shadow_write
  - execute_step
  inputs:
  - migration_plan
  outputs:
  - shadow_active
  - shadow_failed: bool
  unbound_ok: 'narrated: execute_step, shadow_write has no binding in this runtime; the effect is the
    model''s account of it until the ability is bound (audit 2026-09-04, Q1)'
- id: backfill
  speciality: migrator
  abilities:
  - backfill
  - execute_step
  inputs:
  - shadow_active
  outputs:
  - backfill_complete
  - backfill_failed: bool
  unbound_ok: 'narrated: backfill, execute_step has no binding in this runtime; the effect is the model''s
    account of it until the ability is bound (audit 2026-09-04, Q1)'
- id: cutover
  speciality: migrator
  abilities:
  - execute_step
  inputs:
  - backfill_complete
  outputs:
  - cutover_done
  - cutover_failed: bool
  unbound_ok: 'narrated: execute_step has no binding in this runtime; the effect is the model''s account
    of it until the ability is bound (audit 2026-09-04, Q1)'
- id: verify
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
  inputs:
  - cutover_done
  outputs:
  - source_rows: int
  - target_rows: int
  - parity_verified: bool
  criteria: 'The saga ends in one of two consistent states: forward-complete with source and target parity
    verified, or fully unwound with every executed step compensated. A partially applied migration is
    the outcome this graph exists to prevent.'
  retries:
    max: 2
    reissue_effects: true
- id: undo-cutover
  speciality: compensator
  abilities:
  - rollback
  inputs:
  - cutover_done
  outputs:
  - cutover_undone
  unbound_ok: 'narrated: rollback has no binding in this runtime; the effect is the model''s account of
    it until the ability is bound (audit 2026-09-04, Q1)'
- id: undo-backfill
  speciality: compensator
  abilities:
  - rollback
  inputs:
  - backfill_complete
  outputs:
  - backfill_undone
  unbound_ok: 'narrated: rollback has no binding in this runtime; the effect is the model''s account of
    it until the ability is bound (audit 2026-09-04, Q1)'
- id: undo-shadow
  speciality: compensator
  abilities:
  - rollback
  inputs:
  - shadow_active
  outputs:
  - compensated_steps: int
  - executed_steps: int
  - output
  - source_rows: int
  - target_rows: int
  unbound_ok: 'narrated: rollback has no binding in this runtime; the effect is the model''s account of
    it until the ability is bound (audit 2026-09-04, Q1)'
edges:
- from: plan
  to: shadow-write
- from: shadow-write
  to: backfill
- from: backfill
  to: cutover
- from: cutover
  to: verify
- from: verify
  to: undo-cutover
  when: not parity_verified
  kind: compensate
- from: cutover
  to: undo-cutover
  when: cutover_failed
  kind: compensate
- from: backfill
  to: undo-backfill
  when: backfill_failed
  kind: compensate
- from: shadow-write
  to: undo-shadow
  when: shadow_failed
  kind: compensate
- from: undo-cutover
  to: undo-backfill
- from: undo-backfill
  to: undo-shadow
termination:
  max_steps: 40
  contract: every forward step has a compensator; the saga ends verified or fully unwound
verification:
- describe: "either the migration reached parity \u2014 two row counts agreeing, not a model reporting\
    \ that they do \u2014 or every executed step was compensated back"
  assert: output.source_rows == output.target_rows or output.compensated_steps == output.executed_steps
- describe: the migration and its compensator both run, so reversibility is demonstrated rather than asserted
  command: alembic upgrade head
state:
  inputs:
  - goal
  - source_schema
goal:
  required: true
  description: the current schema, the target schema, and the table that must stay live
