apiVersion: agr/v1.1
name: ab-test-analysis
description: Two analysts argue significance and pitfalls, judge writes readout.
category: data-analytics
nodes:
- id: position-a
  speciality: advocate
  abilities:
  - generate
  parallel_group: debate
- id: position-b
  speciality: advocate
  abilities:
  - generate
  parallel_group: debate
- id: judge
  speciality: judge
  abilities:
  - adjudicate
  kind: verifier
  outputs:
  - output
edges:
- from: position-a
  to: judge
- from: position-b
  to: judge
termination:
  max_steps: 8
  contract: stats recomputed from raw data reproduce claimed effect
verification:
- assert: abs(output.recomputed_effect - output.claimed_effect) < 0.01
