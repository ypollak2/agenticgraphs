apiVersion: agr/v1.8
name: ab-test-analysis
description: Two analysts argue significance and pitfalls, judge writes readout.
category: data-analytics
nodes:
- id: position-a
  speciality: advocate
  abilities:
  - generate
  parallel_group: debate
  outputs:
  - argument
- id: position-b
  speciality: advocate
  abilities:
  - generate
  parallel_group: debate
  outputs:
  - argument
- id: judge
  speciality: judge
  abilities:
  - adjudicate
  kind: verifier
  outputs:
  - claimed_effect: float
  - output
  - recomputed_effect: float
  criteria: "The effect recomputed from the raw data reproduces the claimed effect within tolerance, and\
    \ the readout names the pitfalls that could still invalidate it \u2014 peeking, unequal exposure,\
    \ or a metric that moved for an unrelated reason."
edges:
- from: position-a
  to: judge
- from: position-b
  to: judge
termination:
  max_steps: 8
  contract: stats recomputed from raw data reproduce claimed effect
verification:
- assert: abs(output.recomputed_effect - output.claimed_effect) < 0.01
goal:
  required: true
  description: the experiment's raw data and the effect the analysis claims
state:
  inputs:
  - goal
