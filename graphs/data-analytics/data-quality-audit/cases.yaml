cases:
- id: first-attempt-verified
  node_outputs:
    plan:
      steps:
      - decompose goal
      tasks:
      - i: 1
      - i: 2
      - i: 3
    work:
      work_result: &id001
      - id: 1
        status: done
    verify:
      verify_failed: false
      attempts: 1
      output:
        violations:
        - rule_id: null-check
          count: 3
  goal: the customers table, against the CDM completeness rules
  inputs:
    model_name: customers
    rules: &id002
    - rule_id: cdm-001
      column: email
      check: not_null
    - rule_id: cdm-002
      column: country
      check: in_iso3166
    - rule_id: cdm-003
      column: created_at
      check: not_future
    sample_rows: &id003
    - id: 1
      email: a@x.com
      country: GB
      created_at: '2026-01-04'
    - id: 2
      email: null
      country: GB
      created_at: '2026-02-11'
    - id: 3
      email: c@x.com
      country: ZZ
      created_at: '2026-03-01'
- id: retry-then-verified
  node_outputs:
    plan:
      steps:
      - decompose goal
      tasks:
      - i: 1
      - i: 2
      - i: 3
    work:
    - work_result: *id001
    - work_result: *id001
    verify:
    - verify_failed: true
      attempts: 1
    - verify_failed: false
      attempts: 2
      output:
        violations:
        - rule_id: null-check
          count: 3
  goal: the customers table, against the CDM completeness rules
  inputs:
    model_name: customers
    rules: *id002
    sample_rows: *id003
