apiVersion: agr/v1.8
name: data-quality-audit
description: Workers profile each table for nulls, drift, and duplicates.
category: data-analytics
nodes:
- id: plan
  speciality: planner
  abilities:
  - decompose_goal
  outputs:
  - tasks
- id: work
  speciality: worker
  abilities:
  - run_command
  - edit_files
  fan_out:
    over: tasks
    max: 20
    on_partial: continue
  outputs:
  - work_result
  retries:
    max: 2
    reissue_effects: true
  unbound_ok: 'narrated: edit_files has no binding in this runtime; the effect is the model''s account
    of it until the ability is bound (audit 2026-09-04, Q1)'
- id: verify
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
  outputs:
  - output
  - violations: list[{count:int, rule_id:any}]
  - verify_failed: bool
  criteria: Every violation is a machine-readable rule id with the row count that breaks it, so the report
    can be re-run and diffed rather than re-read.
  retries:
    max: 2
    reissue_effects: true
edges:
- from: plan
  to: work
- from: work
  to: verify
- from: verify
  to: work
  when: verify_failed and attempts < 3
termination:
  max_steps: 30
  contract: violations emitted as machine-readable rules with counts
verification:
- assert: all(v.rule_id and v.count >= 0 for v in output.violations)
- describe: the quality rules are executed against the dataset
  command: dbt test --select {model_name}
goal:
  required: true
  description: the dataset to profile and the quality rules it must satisfy
state:
  inputs:
  - goal
  - model_name
