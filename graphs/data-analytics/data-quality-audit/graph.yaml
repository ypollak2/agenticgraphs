apiVersion: agr/v1
name: data-quality-audit
description: Workers profile each table for nulls, drift, and duplicates.
category: data-analytics
nodes:
- id: plan
  speciality: planner
  abilities:
  - decompose_goal
- id: work
  speciality: worker
  abilities:
  - run_command
  - edit_files
  parallel_group: swarm
- id: verify
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
edges:
- from: plan
  to: work
- from: work
  to: verify
- from: verify
  to: work
  when: verify_failed and attempts < 3
termination:
  max_steps: 30
  contract: violations emitted as machine-readable rules with counts
verification:
- assert: violations emitted as machine-readable rules with counts
