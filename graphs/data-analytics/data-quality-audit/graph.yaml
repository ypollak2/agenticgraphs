apiVersion: agr/v1.7
name: data-quality-audit
description: Workers profile each table for nulls, drift, and duplicates.
category: data-analytics
nodes:
- id: plan
  speciality: planner
  abilities:
  - decompose_goal
  outputs:
  - tasks
- id: work
  speciality: worker
  abilities:
  - run_command
  - edit_files
  fan_out:
    over: tasks
    max: 20
    on_partial: continue
  outputs:
  - work_result
- id: verify
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
  outputs:
  - output
  - violations: list[{count:int, rule_id:any}]
edges:
- from: plan
  to: work
- from: work
  to: verify
- from: verify
  to: work
  when: verify_failed and attempts < 3
termination:
  max_steps: 30
  contract: violations emitted as machine-readable rules with counts
verification:
- assert: all(v.rule_id and v.count >= 0 for v in output.violations)
