apiVersion: agr/v1
name: etl-pipeline-builder
description: Design and build an ETL job from source to warehouse.
category: data-analytics
nodes:
- id: plan
  speciality: planner
  abilities:
  - decompose_goal
- id: execute
  speciality: executor
  abilities:
  - execute_step
- id: verify
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
edges:
- from: plan
  to: execute
- from: execute
  to: verify
- from: verify
  to: execute
  when: verify_failed and attempts < 3
termination:
  max_steps: 25
  contract: end-to-end run loads expected row counts
verification:
- assert: end-to-end run loads expected row counts
