apiVersion: agr/v1.8
name: red-team-blue-team-hardening
description: An attacker searches for a working bypass while a defender patches, until the attacker is
  exhausted.
category: security
nodes:
- id: scope
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - surface
  - rules_of_engagement
  inputs:
  - target
- id: attack
  speciality: security-auditor
  abilities:
  - sast_scan
  - read_diff
  outputs:
  - bypass
  - severity
  inputs:
  - surface
  kind: search
  search:
    branch: 4
    depth: 2
    score: severity
    objective: max
    prune: beam(2)
- id: defend
  speciality: executor
  abilities:
  - execute_step
  - edit_files
  outputs:
  - mitigation
  inputs:
  - bypass
- id: retest
  speciality: verifier
  abilities:
  - run_command
  outputs:
  - bypasses
  - output
  - unmitigated
  inputs:
  - mitigation
  kind: verifier
  criteria: The loop terminates because the attacker exhausted its options with every finding mitigated,
    producing evidence of absence rather than absence of evidence. An unmitigated finding means the loop
    stopped early.
edges:
- from: scope
  to: attack
- from: attack
  to: defend
- from: defend
  to: retest
- from: retest
  to: attack
  when: not attacker_exhausted and attempts < 3
termination:
  max_steps: 45
  contract: terminates on attacker exhaustion, producing evidence of absence rather than absence of evidence
verification:
- describe: every bypass `attack` found points at the mitigation that closed it
  assert: all(b.mitigation_ref for b in output.bypasses)
- describe: nothing is left unmitigated
  assert: output.unmitigated == 0
state:
  inputs:
  - goal
  - target
goal:
  required: true
  description: the system to harden and the threat model to harden it against
