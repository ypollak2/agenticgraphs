apiVersion: agr/v1.7
name: soc-alert-investigation
description: Investigate an alert with hypothesis-driven queries.
category: security
nodes:
- id: plan
  speciality: planner
  abilities:
  - decompose_goal
  outputs:
  - steps
- id: execute
  speciality: executor
  abilities:
  - execute_step
  outputs:
  - step_result
- id: verify
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
  outputs:
  - conclusion: any
  - output
  - query_results
edges:
- from: plan
  to: execute
- from: execute
  to: verify
- from: verify
  to: execute
  when: verify_failed and attempts < 3
termination:
  max_steps: 25
  contract: conclusion supported by query results attached
verification:
- assert: len(output.query_results) > 0 and output.conclusion
