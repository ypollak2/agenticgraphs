apiVersion: agr/v1
name: soc-alert-investigation
description: Investigate an alert with hypothesis-driven queries.
category: security
nodes:
- id: plan
  speciality: planner
  abilities:
  - decompose_goal
- id: execute
  speciality: executor
  abilities:
  - execute_step
- id: verify
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
edges:
- from: plan
  to: execute
- from: execute
  to: verify
- from: verify
  to: execute
  when: verify_failed and attempts < 3
termination:
  max_steps: 25
  contract: conclusion supported by query results attached
verification:
- assert: conclusion supported by query results attached
