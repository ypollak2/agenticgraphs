apiVersion: agr/v1.8
name: vuln-remediation-lifecycle
description: Ingest a vulnerability, prioritize it, reproduce it, patch it, prove the patch, and disclose
  behind a human gate.
category: security
nodes:
- id: ingest
  speciality: analyst
  abilities:
  - analyze
  inputs:
  - feed
  outputs:
  - advisory
- id: prioritize
  speciality: supervisor
  kind: subgraph
  ref: security/vuln-prioritization
  inputs:
  - advisory
  outputs:
  - priority
  - ranking: list[{asset_map_ref:any, scanner_evidence:any}]
  maps:
    priority: ranking
- id: reproduce
  speciality: worker
  abilities:
  - run_command
  - edit_files
  inputs:
  - priority
  outputs:
  - repro_confirmed
  - repro_exit_code_before
  retries:
    max: 2
    reissue_effects: true
  unbound_ok: 'narrated: edit_files has no binding in this runtime; the effect is the model''s account
    of it until the ability is bound (audit 2026-09-04, Q1)'
- id: patch
  speciality: executor
  abilities:
  - execute_step
  - edit_files
  inputs:
  - repro_confirmed
  outputs:
  - patch
  unbound_ok: 'narrated: edit_files, execute_step has no binding in this runtime; the effect is the model''s
    account of it until the ability is bound (audit 2026-09-04, Q1)'
- id: prove
  speciality: verifier
  abilities:
  - run_command
  kind: verifier
  inputs:
  - patch
  outputs:
  - repro_exit_code_after
  - repro_exit_code_before
  - exploit_blocked: bool
  criteria: The recorded proof-of-concept no longer succeeds against the patched build, demonstrated by
    re-running it rather than by inspecting the diff. Nothing is disclosed before that re-run passes and
    a human has signed off.
  retries:
    max: 2
    reissue_effects: true
- id: disclose-approval
  speciality: approver
  kind: human
  abilities:
  - approve
  inputs:
  - repro_exit_code_after
  - repro_exit_code_before
  outputs:
  - signed_off: any
  approval:
    contract: signed_off == true and repro_exit_code_before == 0 and repro_exit_code_after != 0
    on_timeout: escalate
- id: disclose
  speciality: producer
  abilities:
  - generate
  inputs:
  - signed_off
  outputs:
  - advisory_url
  - cve_id
  - output
- id: escalate-vuln
  speciality: escalator
  abilities:
  - escalate
  inputs: []
  outputs:
  - escalated: bool
  - escalation_reason
  criteria: The vulnerability is escalated with every patch attempted and the proof-of-concept still succeeding.
    Nothing is disclosed on this path.
  unbound_ok: 'narrated: escalate has no binding in this runtime; the effect is the model''s account of
    it until the ability is bound (audit 2026-09-04, Q1)'
edges:
- from: ingest
  to: prioritize
- from: prioritize
  to: reproduce
- from: reproduce
  to: patch
- from: patch
  to: prove
- from: prove
  to: patch
  when: not exploit_blocked and attempts < 3
- from: prove
  to: disclose-approval
  when: exploit_blocked
- from: disclose-approval
  to: disclose
- from: prove
  to: escalate-vuln
  when: not exploit_blocked and attempts >= 3
termination:
  max_steps: 45
  contract: nothing is disclosed until the exploit is proven blocked and a human has signed off
verification:
- describe: "the recorded proof-of-concept succeeded before the patch and fails after it \u2014 proven\
    \ by re-running it, not by inspecting the diff"
  assert: output.repro_exit_code_before == 0 and output.repro_exit_code_after != 0
- describe: disclosure carries a human signature
  assert: output.signed_off == true
- describe: "the advisory is locatable \u2014 it names the CVE it concerns and where it was published,\
    \ which 'published: true' does not"
  assert: output.advisory_url and output.cve_id
- describe: the proof-of-concept is re-run against the patched build
  command: pytest -q {repro_path}
state:
  inputs:
  - goal
  - feed
  - repro_path
goal:
  required: true
  description: the vulnerability to remediate and the affected estate
