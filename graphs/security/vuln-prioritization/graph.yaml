apiVersion: agr/v1.5
name: vuln-prioritization
description: Rank findings by exploitability and blast radius.
category: security
nodes:
- id: intake
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - summary
- id: produce
  speciality: producer
  abilities:
  - generate
  outputs:
  - ranking: list[{asset_map_ref:any, scanner_evidence:any}]
- id: review
  speciality: critic
  abilities:
  - critique
  kind: verifier
  outputs:
  - output
edges:
- from: intake
  to: produce
- from: produce
  to: review
- from: review
  to: produce
  when: revision_requested and attempts < 2
termination:
  max_steps: 12
  contract: ranking inputs cite scanner evidence and asset map
verification:
- assert: all(r.scanner_evidence and r.asset_map_ref for r in output.ranking)
