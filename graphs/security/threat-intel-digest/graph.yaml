apiVersion: agr/v1.8
name: threat-intel-digest
description: Summarize feeds into an actionable daily brief.
category: security
nodes:
- id: partition
  speciality: analyst
  abilities:
  - analyze
  outputs:
  - shards
- id: map
  speciality: mapper
  abilities:
  - map_shard
  fan_out:
    over: shards
    max: 20
    on_partial: continue
  outputs:
  - shard_result
- id: reduce
  speciality: reducer
  abilities:
  - reduce_merge
  - web_search
  kind: verifier
  outputs:
  - entries: list[{advisory_url:any, cve_ids:any}]
  - output
  criteria: Every item links its source advisory and the CVE ids it concerns, and relevance is judged
    against the estate actually run rather than the severity score in isolation.
edges:
- from: partition
  to: map
- from: map
  to: reduce
termination:
  max_steps: 20
  contract: every item links source advisory with CVE ids
verification:
- assert: all(i.advisory_url and i.cve_ids for i in output.entries)
goal:
  required: true
  description: the feeds to digest and the estate the brief is written for
state:
  inputs:
  - goal
