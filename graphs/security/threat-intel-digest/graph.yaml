apiVersion: agr/v1
name: threat-intel-digest
description: Summarize feeds into an actionable daily brief.
category: security
nodes:
- id: partition
  speciality: analyst
  abilities:
  - analyze
- id: map
  speciality: mapper
  abilities:
  - map_shard
  parallel_group: shards
- id: reduce
  speciality: reducer
  abilities:
  - reduce_merge
  kind: verifier
edges:
- from: partition
  to: map
- from: map
  to: reduce
termination:
  max_steps: 20
  contract: every item links source advisory with CVE ids
verification:
- assert: every item links source advisory with CVE ids
