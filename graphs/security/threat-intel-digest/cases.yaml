cases:
- id: single-item
  node_outputs:
    partition:
      shard_count: 1
      shards:
      - i: 1
      - i: 2
      - i: 3
    map:
      shard_result: &id001
      - id: 1
        finding: ok
    reduce:
      output:
        entries:
        - advisory_url: https://vendor.example/advisory/1
          cve_ids:
          - CVE-2026-1
    estate-match: &id002
      affected_assets:
      - cve: CVE-2026-1
        assets:
        - api-1
  goal: this week's CISA and vendor feeds, for a Kubernetes estate
  inputs:
    feeds: &id003
    - source: CISA
      advisory_url: https://cisa.gov/advisories/aa26-231
      cve_ids:
      - CVE-2026-2211
      product: kubelet
    - source: vendor
      advisory_url: https://kubernetes.io/security/2026-08
      cve_ids:
      - CVE-2026-2244
      - CVE-2026-2245
      product: kube-apiserver
    estate: &id004
      platform: Kubernetes
      version: '1.31'
- id: multi-item
  node_outputs:
    partition:
      shard_count: 2
      shards:
      - i: 1
      - i: 2
      - i: 3
    map:
      shard_result: *id001
    reduce:
      output:
        entries:
        - advisory_url: https://vendor.example/advisory/1
          cve_ids:
          - CVE-2026-1
        - advisory_url: https://vendor.example/advisory/2
          cve_ids:
          - CVE-2026-2
          - CVE-2026-3
    estate-match: *id002
  goal: this week's CISA and vendor feeds, for a Kubernetes estate
  inputs:
    feeds: *id003
    estate: *id004
